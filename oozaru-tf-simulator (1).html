<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oozaru TF · Simulator</title>
<style>
    .layer-half-hdr { font-size: 12px; font-weight: 600; color: var(--ambl); margin: 10px 0 4px; }
    .fig-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .fig-svg { width: 31%; min-width: 150px; max-width: 260px; height: auto; background: var(--bg2); border: 1px solid var(--bdr); border-radius: var(--rad); }
    .fig-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; }
    .fig-leg-item { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .fig-sw { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
    .fig-photo-svg { width: 100%; max-width: 420px; height: auto; display: block; margin-top: 6px; border: 1px solid var(--bdr); border-radius: var(--rad); }
    :root {
        --fig-skin: #3a4a5e; --fig-skin-edge: #5b6f86;
        color-scheme: dark;
        --bg0: #080c14;
        --bg1: #0e1525;
        --bg2: #141e30;
        --bg3: #1a2640;
        --bdr: rgba(255, 255, 255, 0.07);
        --bdr2: rgba(255, 255, 255, 0.13);
        --txt: #d8e6f0;
        --txt2: #7a92a8;
        --txt3: #4f6577;
        --amb: #f59e0b;
        --ambl: #fcd34d;
        --blu: #38bdf8;
        --blud: rgba(56, 189, 248, 0.1);
        --grn: #10b981;
        --grnd: rgba(16, 185, 129, 0.1);
        --red: #ef4444;
        --redl: #f87171;
        --mono: 'Courier New', Consolas, monospace;
        --rad: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
        background: var(--bg0);
        color: var(--txt);
        font-family: -apple-system, 'Segoe UI', sans-serif;
        font-size: 14px;
        min-height: 100vh;
        padding-bottom: 60px;
    }
    .hdr {
        background: var(--bg1);
        border-bottom: 1px solid var(--bdr);
        padding: 13px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 50;
        flex-wrap: wrap;
    }
    .hdr-title { font-size: 16px; font-weight: 700; letter-spacing: -.3px }
    .hdr-title em { color: var(--amb); font-style: normal }
    .hdr-sub { font-size: 11px; color: var(--txt3); font-family: var(--mono); margin-top: 1px }
    .hdr-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

    .tabs {
        display: flex;
        background: var(--bg1);
        border-bottom: 1px solid var(--bdr);
        padding: 0 20px;
        flex-wrap: wrap;
        align-items: center;
    }
    .tab {
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 500;
        color: var(--txt2);
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        cursor: pointer;
        transition: color .15s
    }
    .tab:hover { color: var(--txt) }
    .tab.on { color: var(--amb); border-bottom-color: var(--amb) }

    .subj-tab-wrap { display: flex; align-items: center; border-bottom: 2px solid transparent; }
    .subj-tab-wrap.on { border-bottom-color: var(--blu); }
    .subj-tab { padding: 9px 6px 9px 14px; font-size: 13px; font-weight: 500; color: var(--txt2); background: none; border: none; cursor: pointer; }
    .subj-tab-wrap.on .subj-tab { color: var(--blu); }
    .subj-tab-x { background: none; border: none; color: var(--txt3); cursor: pointer; padding: 2px 10px 2px 2px; font-size: 14px; line-height: 1; }
    .subj-tab-x:hover { color: var(--redl); }
    .subj-add { padding: 8px 14px; font-size: 16px; font-weight: 700; color: var(--txt2); background: none; border: none; cursor: pointer; }
    .subj-add:hover { color: var(--amb); }

    .subj-toolbar {
        display: flex; gap: 8px; align-items: center; padding: 10px 22px;
        background: var(--bg1); border-bottom: 1px solid var(--bdr); flex-wrap: wrap;
    }
    .subj-toolbar .spacer { flex: 1; }
    .subj-name-input {
        background: var(--bg2); border: 1px solid var(--bdr2); border-radius: 5px; color: var(--txt);
        padding: 6px 10px; font-size: 13px; font-weight: 600; outline: none; width: 220px; max-width: 100%;
    }
    .subj-name-input:focus { border-color: var(--amb); }

    .main { max-width: 1200px; margin: 0 auto; padding: 22px 16px; }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 3px }
    h3 { font-size: 13px; font-weight: 600; color: var(--ambl); margin-bottom: 2px; }
    .sub { font-size: 12px; color: var(--txt2); margin-bottom: 18px; line-height: 1.5; }

    .card { background: var(--bg1); border: 1px solid var(--bdr); border-radius: 8px; margin-bottom: 12px; overflow: hidden }
    .card-hdr { display: flex; align-items: center; gap: 8px; padding: 11px 15px; }
    .card-hdr.clickable { cursor: pointer; user-select: none; }
    .card-hdr.clickable:hover { background: var(--bg2) }
    .card-body { padding: 4px 15px 18px }

    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px }
    .g4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px }
    @media (max-width: 860px) { .g4, .g3 { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { .g4, .g3, .g2 { grid-template-columns: 1fr; } .hdr { padding: 12px 16px; } }

    .fld { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; min-width: 0; }
    .fld label { font-size: 11px; color: var(--txt2); letter-spacing: .2px; }
    .fld label .req-dot { color: var(--amb); }
    .fld input, .fld select {
        background: var(--bg2); border: 1px solid var(--bdr); border-radius: 5px; color: var(--txt);
        padding: 7px 9px; font-size: 13px; outline: none; transition: border-color .15s;
        width: 100%; font-family: inherit; min-width: 0;
    }
    .fld input:focus, .fld select:focus { border-color: var(--amb) }
    select { color-scheme: dark; }
    select option { background: #141e30; color: #d8e6f0; }
    select option:checked { background: #1a2640; color: #fcd34d; }
    select option[value=""] { color: #7a92a8; }
    .ftin-row { display: flex; gap: 6px; align-items: center; }
    .ftin-row input { flex: 1 1 0; }
    .ftin-row span { font-size: 11px; color: var(--txt2); font-family: var(--mono); }
    .fld input.empty, .fld select.empty { border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.04); }
    .fld input.bad, .fld select.bad { border-color: rgba(239,68,68,0.7); background: rgba(239,68,68,0.06); }
    .fld input::placeholder { color: #5f7d93; font-style: italic; }
    .unit-suffix { font-size: 11px; color: var(--txt3); margin-top: 2px; font-family: var(--mono); }
    .input-row { display: flex; gap: 4px; align-items: center; }
    .reset-btn { background: none; border: 1px solid var(--bdr); border-radius: 4px; color: var(--txt2); cursor: pointer; font-size: 12px; padding: 5px 7px; }
    .reset-btn:hover { color: var(--amb); border-color: var(--amb); }
    .src-tag { font-size: 10px; font-family: var(--mono); padding: 1px 5px; border-radius: 3px; margin-left: 4px; }
    .src-tag.est { color: var(--blu); background: var(--blud); }
    .src-tag.ent { color: var(--grn); background: var(--grnd); }
    .src-tag.calc { color: var(--txt2); background: rgba(255,255,255,0.05); }
    .grp-title { font-size: 11px; color: var(--txt2); text-transform: uppercase; letter-spacing: .7px; margin: 14px 0 8px; font-weight: 600; }
    .grp-sub { font-size: 11px; color: var(--txt3); margin: -4px 0 8px; }

    .btn {
        display: inline-flex; align-items: center; gap: 5px; padding: 7px 13px; border-radius: var(--rad);
        border: 1px solid var(--bdr2); font-size: 12px; font-weight: 500; cursor: pointer;
        transition: background .13s, color .13s; color: var(--txt2); background: var(--bg2)
    }
    .btn:hover { background: var(--bg3); color: var(--txt) }
    .btn.pri { background: var(--amb); color: #180800; border-color: var(--amb) }
    .btn.pri:hover { background: var(--ambl); }
    .btn.del { background: rgba(239, 68, 68, .08); color: var(--redl); border-color: rgba(239, 68, 68, .2) }
    .btn.sm { padding: 5px 10px; font-size: 11px; }

    .info {
        background: var(--blud); border: 1px solid rgba(56, 189, 248, .2); border-radius: 6px;
        padding: 9px 13px; font-size: 12px; color: var(--blu); margin-bottom: 16px; line-height: 1.6
    }
    .empty { text-align: center; padding: 60px 20px; color: var(--txt3); border: 1px dashed var(--bdr); border-radius: 8px }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 700; font-family: var(--mono); }
    .badge.complete { background: rgba(16,185,129,.12); color: var(--grn); }
    .badge.incomplete { background: rgba(245,158,11,.12); color: var(--amb); }
    .badge.error { background: rgba(239,68,68,.14); color: var(--redl); }

    .toast {
        position: fixed; bottom: 20px; right: 20px; background: var(--bg2); border: 1px solid var(--bdr2);
        border-left: 3px solid var(--grn); border-radius: 6px; padding: 10px 16px; font-size: 12px; color: var(--txt);
        z-index: 200; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s;
        pointer-events: none; max-width: calc(100vw - 40px);
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.warn { border-left-color: var(--amb); }
    .toast.err { border-left-color: var(--red); }
    #importFileInput { display: none; }

    /* Validation card */
    .val-card { border-color: rgba(239,68,68,.35); }
    .val-card.ok { border-color: rgba(16,185,129,.3); }
    .val-item { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--bdr); font-size: 12px; line-height: 1.5; }
    .val-item:last-child { border-bottom: none; }
    .val-item .vi-icon { color: var(--redl); flex: 0 0 auto; }
    .val-item .vi-msg { flex: 1; color: var(--txt); }
    .val-item .vi-where { color: var(--txt2); font-family: var(--mono); font-size: 11px; }
    .linkbtn { background: none; border: none; color: var(--blu); cursor: pointer; font-size: 11px; white-space: nowrap; padding: 0; }
    .linkbtn:hover { text-decoration: underline; }
    details.req-list > summary { cursor: pointer; font-size: 12px; color: var(--amb); padding: 6px 0; }
    .req-grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 0 4px; }
    .req-chip { background: var(--bg2); border: 1px solid var(--bdr); border-radius: 4px; padding: 3px 8px; font-size: 11px; color: var(--txt2); cursor: pointer; }
    .req-chip:hover { border-color: var(--amb); color: var(--txt); }
    .flash { animation: flash 1.8s ease-out; }
    @keyframes flash { 0% { box-shadow: 0 0 0 3px rgba(245,158,11,.95); } 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); } }

    /* Derived body tables */
    .dtable { width: 100%; border-collapse: collapse; font-size: 12px; }
    .dtable th { text-align: left; color: var(--txt2); font-weight: 600; font-size: 11px; padding: 5px 6px; border-bottom: 1px solid var(--bdr2); }
    .dtable td { padding: 5px 6px; border-bottom: 1px solid var(--bdr); color: var(--txt); }
    .dtable td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
    .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 860px) { .dgrid { grid-template-columns: 1fr; } }
    .bf-line { font-size: 12px; color: var(--txt2); line-height: 1.7; font-family: var(--mono); }
    .bf-big { font-size: 20px; font-weight: 700; color: var(--txt); font-family: var(--mono); }
    .muted { color: var(--txt3); font-size: 12px; }

    /* Region cards */
    .region-card { background: var(--bg1); border: 1px solid var(--bdr); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .region-hdr { display:flex; align-items:center; gap:10px; padding: 12px 16px; cursor:pointer; user-select:none; background: var(--bg1); }
    .region-hdr:hover { background: var(--bg2); }
    .region-hdr .rt { font-size: 13px; font-weight: 700; color: var(--txt); }
    .region-hdr .rcnt { margin-left:auto; font-size: 10px; font-family: var(--mono); }
    .region-hdr .rcnt.done { color: var(--grn); }
    .region-hdr .rcnt.pending { color: var(--amb); }
    .region-hdr .car { color: var(--amb); font-size: 11px; transition: transform .15s; width: 12px; }
    .region-card.open .car { transform: rotate(90deg); }
    .region-body { display:none; padding: 14px 16px 18px; border-top: 1px solid var(--bdr); }
    .region-card.open .region-body { display:block; }
    .fld select.dv { font-size: 12px; }
    .fld .desc-value { font-size: 10px; color: var(--txt3); font-family: var(--mono); margin-top: 1px; min-height: 12px; }
    .kind { font-size: 9px; text-transform: uppercase; letter-spacing: .6px; padding: 1px 5px; border-radius: 3px; margin-left: 4px; font-family: var(--mono); }
    .kind.muscle { color: #fb923c; background: rgba(251,146,60,.1); }
    .kind.shape { color: #c084fc; background: rgba(192,132,252,.1); }
    .kind.definition { color: #f472b6; background: rgba(244,114,182,.1); }
    .kind.leanness { color: #34d399; background: rgba(52,211,153,.1); }
    .kind.structure { color: #60a5fa; background: rgba(96,165,250,.1); }


    /* Garments */
    .garm-card { background: var(--bg1); border: 1px solid var(--bdr); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
    .garm-hdr { display:flex; align-items:center; gap:8px; padding: 10px 14px; background: var(--bg2); flex-wrap: wrap; }
    .garm-name { background: transparent; border: 1px solid transparent; border-radius: 4px; color: var(--txt); font-size: 14px; font-weight: 700; padding: 4px 6px; min-width: 0; width: 260px; max-width: 100%; }
    .garm-name:hover, .garm-name:focus { border-color: var(--bdr2); outline: none; background: var(--bg1); }
    .garm-type { font-size: 11px; color: var(--txt2); font-family: var(--mono); }
    .garm-hdr .spacer { flex: 1; }
    .garm-body { padding: 4px 0 6px; }
    details.gsec { border-top: 1px solid var(--bdr); }
    details.gsec > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 600; user-select: none; }
    details.gsec > summary::-webkit-details-marker { display: none; }
    details.gsec > summary:hover { background: var(--bg2); }
    details.gsec > summary .car { color: var(--amb); font-size: 11px; width: 12px; transition: transform .15s; }
    details.gsec[open] > summary .car { transform: rotate(90deg); }
    .gsec-body { padding: 6px 16px 16px; }
    details.subsec { margin-top: 6px; }
    details.subsec > summary { cursor: pointer; font-size: 12px; color: var(--blu); padding: 6px 0; }
    .layer-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--bdr); }
    .layer-row:last-child { border-bottom: none; }
    .layer-num { width: 24px; height: 24px; border-radius: 50%; background: var(--bg3); color: var(--ambl); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; font-family: var(--mono); }
    .layer-name { font-size: 13px; font-weight: 600; }
    .layer-detail { font-size: 11px; color: var(--txt2); margin-top: 2px; }
    .reset-btn[disabled] { opacity: .3; cursor: default; }
    .comp-row { display: grid; grid-template-columns: minmax(0, 2fr) 90px auto auto; gap: 6px; align-items: center; margin-bottom: 6px; max-width: 520px; }
    .comp-row select, .comp-row input, .tcell select, .tcell input, .input-row select, .input-row input[type=text] {
        background: var(--bg2); border: 1px solid var(--bdr); border-radius: 4px; color: var(--txt); padding: 6px 8px; font-size: 12px; font-family: inherit; min-width: 0; outline: none; }
    .tcell select, .tcell input { width: 100%; }
    .fabric-props { font-size: 12px; color: var(--txt2); line-height: 1.6; margin-top: 10px; background: var(--bg0); border: 1px solid var(--bdr); border-radius: 6px; padding: 8px 10px; }
    .ro { font-size: 12px; color: var(--txt2); background: var(--bg0); border: 1px solid var(--bdr); border-radius: 5px; padding: 7px 9px; font-family: var(--mono); }
    .chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--txt); margin: 6px 0; cursor: pointer; }
    .chk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2px 14px; }
    .tablewrap { overflow-x: auto; }
    .row-bad td { background: rgba(239,68,68,.08); }
    .row-warn td { background: rgba(245,158,11,.06); }
    .note-line { font-size: 12px; color: var(--txt2); margin-top: 6px; line-height: 1.6; }
    .seam-list { font-size: 12px; color: var(--txt2); line-height: 1.8; }
    .modal-box.wide { max-width: 760px; }
    .modal-tabs { display: flex; border-bottom: 1px solid var(--bdr); }
    .tpl-cat { margin: 12px 0; }
    .tpl-cat h3 { margin-bottom: 6px; }
    .tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    @media (max-width: 600px) { .tpl-grid { grid-template-columns: 1fr; } }
    .tpl-btn { text-align: left; background: var(--bg2); border: 1px solid var(--bdr); border-radius: 6px; padding: 8px 11px; color: var(--txt); cursor: pointer; font-size: 12px; }
    .tpl-btn:hover { background: var(--bg3); border-color: var(--amb); }
    .region-note { font-size: 12px; color: var(--txt2); line-height: 1.5; margin-bottom: 10px; }

    /* Posture parser */
    textarea.parser-box {
        background: var(--bg2); border: 1px solid var(--bdr2); border-radius: 6px; color: var(--txt);
        padding: 10px 12px; font-size: 13px; width: 100%; min-height: 90px; resize: vertical;
        outline: none; font-family: inherit; line-height: 1.5;
    }
    textarea.parser-box:focus { border-color: var(--amb); }
    .parser-review { background: var(--bg0); border: 1px solid var(--bdr); border-radius: 6px; padding: 10px 12px; margin-top: 10px; font-size: 12px; }
    .parser-review-row { display:flex; align-items:center; gap:8px; padding: 6px 0; border-bottom: 1px solid var(--bdr); font-size: 12px; flex-wrap: wrap; }
    .parser-review-row:last-child { border-bottom: none; }
    .parser-review-row .prj { color: var(--txt2); flex:1; min-width: 140px; }
    .parser-review-row .prv { color: var(--blu); font-family: var(--mono); }
    .parser-review-row .prc { color: var(--txt3); font-style: italic; }
    .measure-progress { font-size: 11px; color: var(--txt3); font-family: var(--mono); margin-left: auto; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display:flex; align-items:center; justify-content:center; padding: 20px; }
    .modal-box { background: var(--bg1); border: 1px solid var(--bdr2); border-radius: 10px; max-width: 520px; width: 100%; max-height: 82vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { margin-bottom: 10px; }
    .modal-box p { font-size: 13px; color: var(--txt2); line-height: 1.6; margin-bottom: 14px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }


    /* Results */
    .warn-info { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.3); color: var(--ambl); }
    .err-info { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.3); color: var(--redl); }
    .ok-info { background: rgba(16,185,129,.08); border-color: rgba(16,185,129,.3); color: #6ee7b7; }
    .run-bar { margin: 4px 0 14px; }
    .run-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .run-row .spacer { flex: 1; }
    .btn[disabled] { opacity: .4; cursor: not-allowed; }
    .btn.done { border-color: rgba(16,185,129,.4); color: #6ee7b7; }
    .unit-sel { background: var(--bg2); border: 1px solid var(--bdr2); border-radius: 5px; color: var(--txt); padding: 5px 8px; font-size: 11px; }
    .run-progress { height: 4px; background: var(--bg2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .run-progress-bar { height: 100%; width: 0; background: var(--amb); transition: width .15s; }
    .chart-wrap { margin: 6px 0 14px; }
    .chart-title { font-size: 11px; color: var(--txt2); margin-bottom: 4px; font-weight: 600; }
    .chart-canvas { width: 100%; display: block; background: var(--bg0); border: 1px solid var(--bdr); border-radius: 6px; cursor: crosshair; }
    .chart-tip { position: absolute; display: none; pointer-events: none; background: var(--bg2); border: 1px solid var(--bdr2); border-radius: 5px; padding: 6px 8px; font-size: 11px; color: var(--txt); z-index: 5; min-width: 160px; max-width: 260px; font-family: var(--mono); line-height: 1.5; }
    .chart-tip .tip-t { color: var(--ambl); margin-bottom: 2px; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 5px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; background: none; border: none; color: var(--txt2); font-size: 10px; font-family: var(--mono); cursor: pointer; padding: 1px 0; }
    .legend-item.off { opacity: .35; text-decoration: line-through; }

            const lo = Math.max(0, c.avgDiff + (lfIdx - 5 - c.tolSteps) * c.perStep);
            const hi = c.avgDiff + (lfIdx - 5 + c.tolSteps) * c.perStep;
            err('Lat Flare "' + FIELD_INDEX['abs.latFlare'].options[lfIdx].label + '" implies the chest is about ' + fmt(lo, 0) + '\u2013' + fmt(hi, 0) + ' cm larger than the waist; your measurements differ by ' + fmt(diff) + ' cm.', { type: 'd', region: 'abs', key: 'latFlare' });
        }
    }

    // 6a. Relaxed vs flexed, torso shape.
    const ovv = (k) => posNum(ov[k]);
    [['thighRelaxed', 'circThighMax'], ['calfRelaxed', 'circCalfMax'], ['forearmRelaxed', 'circForearmMax']].forEach(([rk, mk]) => {
        if (ovv(rk) !== null && g(mk) !== null && ovv(rk) > g(mk)) err(OVERRIDE_INDEX[rk].label + ' (' + ovv(rk) + ' cm) is larger than ' + MEASUREMENT_INDEX[mk].label + ' (' + g(mk) + ' cm), which is the flexed value. Relaxed can\u2019t be bigger than flexed.', { type: 'o', key: rk });
    });
    if (ovv('chestTensed') !== null && g('circChest') !== null && ovv('chestTensed') < g('circChest')) err('Chest (Tensed) is smaller than the breathed-out Chest measurement.', { type: 'o', key: 'chestTensed' });
    if (ovv('ribcageCirc') !== null && g('circChest') !== null && ovv('ribcageCirc') > g('circChest')) err('Ribcage (' + ovv('ribcageCirc') + ' cm) is larger than the Chest at its fullest point (' + g('circChest') + ' cm).', { type: 'o', key: 'ribcageCirc' });
    { const hl = ovv('headLength') !== null ? ovv('headLength') : val('headLength'), hb = ovv('headBreadth') !== null ? ovv('headBreadth') : val('headBreadth'), hc = g('circHead');
      if ((ovv('headLength') !== null || ovv('headBreadth') !== null) && hl && hb && hc) {
        if (hb >= hl) err('Head Breadth (' + fmt(hb) + ' cm) must be smaller than Head Length (' + fmt(hl) + ' cm).', { type: 'o', key: ovv('headBreadth') !== null ? 'headBreadth' : 'headLength' });
        else { const c = Math.PI * Math.sqrt((hl * hl + hb * hb) / 2) * 1.02; if (Math.abs(c - hc) / hc > 0.12) err('Head length and breadth (' + fmt(hl) + ' \u00d7 ' + fmt(hb) + ' cm) don\u2019t fit a ' + hc + ' cm head circumference (they give about ' + fmt(c, 0) + ' cm around).', { type: 'o', key: ovv('headLength') !== null ? 'headLength' : 'headBreadth' }); }
      } }
    if (ovv('shoulderWidth') !== null && g('heightIn') !== null && (ovv('shoulderWidth') < 0.17 * g('heightIn') * 2.54 || ovv('shoulderWidth') > 0.32 * g('heightIn') * 2.54)) err('Shoulder Width (' + ovv('shoulderWidth') + ' cm) doesn\u2019t fit a height of ' + fmt(g('heightIn') * 2.54) + ' cm; shoulder-tip to shoulder-tip is usually 20\u201328% of height.', { type: 'o', key: 'shoulderWidth' });
    if (ovv('shoulderWidth') !== null && g('circShoulders') !== null && ovv('shoulderWidth') > 0.5 * g('circShoulders')) err('Shoulder Width (' + ovv('shoulderWidth') + ' cm) is more than half the shoulder circumference (' + g('circShoulders') + ' cm), which isn\u2019t possible.', { type: 'o', key: 'shoulderWidth' });
    if (ovv('backWaistLength') !== null && g('torsoLength') !== null && (ovv('backWaistLength') < 0.5 * g('torsoLength') || ovv('backWaistLength') > 0.85 * g('torsoLength'))) err('Back Waist Length (' + ovv('backWaistLength') + ' cm) doesn\u2019t fit a torso length of ' + g('torsoLength') + ' cm; it is usually 60\u201375% of it.', { type: 'o', key: 'backWaistLength' });
    if (ovv('armscyeCirc') !== null && g('circBicepRelaxed') !== null && ovv('armscyeCirc') < 1.05 * g('circBicepRelaxed')) err('Armhole (' + ovv('armscyeCirc') + ' cm) must be larger than the relaxed upper arm (' + g('circBicepRelaxed') + ' cm): it goes around the top of the arm and over the shoulder.', { type: 'o', key: 'armscyeCirc' });
    if (ovv('armscyeCirc') !== null && g('circShoulders') !== null && ovv('armscyeCirc') > 0.6 * g('circShoulders')) err('Armhole (' + ovv('armscyeCirc') + ' cm) is too large for a ' + g('circShoulders') + ' cm shoulder circumference.', { type: 'o', key: 'armscyeCirc' });
    if (ovv('acrossBack') !== null && g('circChest') !== null && (ovv('acrossBack') < 0.25 * g('circChest') || ovv('acrossBack') > 0.55 * g('circChest'))) err('Across Back (' + ovv('acrossBack') + ' cm) doesn\u2019t fit a ' + g('circChest') + ' cm chest; it is usually 30\u201345% of the chest.', { type: 'o', key: 'acrossBack' });
    if (ovv('crotchLength') !== null && R._crotchEst && Math.abs(ovv('crotchLength') / R._crotchEst - 1) > 0.3) err('Crotch Length (' + ovv('crotchLength') + ' cm) is more than 30% from what his height, torso and seat imply (about ' + fmt(R._crotchEst, 0) + ' cm). Measure from the front waist, down through the crotch, up to the back waist.', { type: 'o', key: 'crotchLength' });

    // 6b. Weight vs the measured body (segment volumes x body density).
    if (!errors.length && g('weightKg') !== null) {
        const ctxW = bodyContextFrom(s, { derived: R, errors });
        const est = ctxW.ok ? estimateWeightFromBody(ctxW, bf && !bf.error ? bf.final : null) : null;
        if (est) {
            const ratio = g('weightKg') / est.kg;
            weightCheck = { kg: est.kg, ratio, bfUsed: est.bf };
            if (Math.abs(ratio - 1) > CONSISTENCY.weight.tol) err('Weight ' + g('weightKg') + ' kg doesn\u2019t fit the measured body: its circumferences and lengths add up to about ' + fmt(est.kg, 0) + ' kg (allowed range ' + fmt(est.kg * (1 - CONSISTENCY.weight.tol), 0) + '\u2013' + fmt(est.kg * (1 + CONSISTENCY.weight.tol), 0) + ' kg). Check Weight, Height and the circumferences.', { type: 'm', key: 'weightKg' });
        }
    }

    // 7. Body fat.
    if (bf && bf.error) err(bf.error, { type: 'm', key: 'circAbdomen' });
    if (bf && !bf.error) {
        if (bf.contradiction) err('Body-fat contradiction: your measurements give about ' + fmt(bf.navy) + '% body fat, but the visible-bone and leanness fields suggest about ' + fmt(bf.implied) + '%. Check Abdomen and Neck circumference, or the leanness fields.', { type: 'm', key: 'circAbdomen' });
        const c = CONSISTENCY.definitionVsFat;
        if (bf.final >= c.maxBodyFat) c.fields.forEach(path => {
            const [rg, k] = path.split('.');
            const v = descNumeric(s, rg, k);
            if (v !== null && v >= c.minValue) err(FIELD_INDEX[path].label + ' "' + FIELD_INDEX[path].options[descIndex(s, rg, k)].label + '" needs a low body fat, but the estimate is ' + fmt(bf.final) + '%.', { type: 'd', region: rg, key: k });
        });
    }

    return { errors, missing, derived: R, bodyFat: bf, weightCheck };
}

function getSubjectCompleteness(s) {
    let total = 0, done = 0;
    MEASUREMENT_FIELDS.forEach(f => { if (f.auto) return; total++; if (num(s.physique.measurements[f.key]) !== null) done++; });
    PHYSIQUE_SCHEMA.forEach(r => r.fields.forEach(f => { if (!isFieldRequired(s, f)) return; total++; if (descEntry(s, r.key, f.key)) done++; }));
    return { done, total, complete: done === total };
}
function getRegionCompleteness(s, regionKey) {
    const region = PHYSIQUE_SCHEMA.find(r => r.key === regionKey);
    let done = 0, total = 0;
    region.fields.forEach(f => { if (!isFieldRequired(s, f)) return; total++; if (descEntry(s, regionKey, f.key)) done++; });
    return { done, total };
}

/* =========================================================================
   SECTION: SAVE / LOAD / MIGRATION
   Saved data = inputs only. Three ways to keep it:
     1. automatic save in this browser (localStorage)
     2. Export / Import JSON
     3. Save Copy of Simulator: a new HTML file with the data built in
   ========================================================================= */

function serializeState() {
    return {
        formatVersion: FORMAT_VERSION, appVersion: APP_VERSION, savedAt: new Date().toISOString(),
        activeSubjectId: state.activeSubjectId,
        subjects: state.subjectOrder.map(id => JSON.parse(JSON.stringify(state.subjects[id], (k, v) => (k && k[0] === '_') ? undefined : v))),
        wardrobe: JSON.parse(JSON.stringify(state.wardrobe || [])),
    };
}

let _saveTimer = null;
function scheduleSave() {
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => {
        try { localStorage.setItem(LS_KEY, JSON.stringify(serializeState())); }
        catch (e) { /* storage unavailable (private window, file permissions) - export/save-copy still work */ }
    }, 400);
}

/* v1 descriptor values were spaced 0..1 (i/(n-1)); map back to an option index. */
function v1ValueToIndex(f, value) {
    if (typeof value !== 'number' || !isFinite(value)) return null;
    if (f.key === 'pecShape') { const i = [0, 0.4, 0.7, 1.0, 1.5].findIndex(v => Math.abs(v - value) < 1e-6); return i >= 0 ? i : null; }
    const i = Math.round(value * (f.options.length - 1));
    return (i >= 0 && i < f.options.length) ? i : null;
}

function sanitizeSubject(raw, warnings, fromV1) {
    const s = makeBlankSubject(typeof raw.name === 'string' && raw.name.trim() ? raw.name.trim().slice(0, 60) : 'Imported Subject');
    if (typeof raw.id === 'string' && raw.id) s.id = raw.id;
    const rp = raw.physique || {};
    const rm = rp.measurements || {};
    if (fromV1) {
        if (num(rm.heightFt) !== null) s.physique.measurements.heightIn = +(Number(rm.heightFt) * 12).toFixed(2);
    }
    MEASUREMENT_FIELDS.forEach(f => { if (f.key in rm) s.physique.measurements[f.key] = num(rm[f.key]); });
    const ro = rp.overrides || {};
    OVERRIDE_FIELDS.forEach(f => { if (f.key in ro) s.physique.overrides[f.key] = posNum(ro[f.key]); });
    const rd = rp.descriptors || {};
    PHYSIQUE_SCHEMA.forEach(r => r.fields.forEach(f => {
        const v = rd[r.key] ? rd[r.key][f.key] : undefined;
        if (v === undefined || v === null) return;
        if (fromV1) {
            const i = v1ValueToIndex(f, v);
            if (i !== null) s.physique.descriptors[r.key][f.key] = { i, label: f.options[i].label };
            else warnings.push(s.name + ': could not convert ' + f.label + ' from the old format.');
        } else if (typeof v === 'object' && Number.isInteger(v.i) && typeof v.label === 'string') {
            s.physique.descriptors[r.key][f.key] = { i: v.i, label: v.label }; // checked by validation, never silently remapped
        }
    }));
    if (rp.posture && typeof rp.posture === 'object') POSTURE_JOINTS.forEach(j => { if (num(rp.posture[j.key]) !== null) s.physique.posture[j.key] = clampToJointROM(j.key, Number(rp.posture[j.key])); });
    if (typeof rp.postureParserText === 'string') s.physique.postureParserText = rp.postureParserText;
    if (rp.postureParserCitations && typeof rp.postureParserCitations === 'object') s.physique.postureParserCitations = Object.assign({}, rp.postureParserCitations);
    if (['default', 'parsed', 'manual'].includes(rp.postureSource)) s.physique.postureSource = rp.postureSource;
    if (num(rp.startTension) !== null) s.physique.startTension = clamp(Number(rp.startTension), 0, 1);
    if (typeof rp.tensionCitation === 'string') s.physique.tensionCitation = rp.tensionCitation;
    if (rp.asymmetry && typeof rp.asymmetry === 'object') s.physique.asymmetry = { side: ASYM_SIDES[rp.asymmetry.side] ? rp.asymmetry.side : 'none', pct: num(rp.asymmetry.pct) !== null ? clamp(Number(rp.asymmetry.pct), 0, 10) : 2 };
    if (FAT_DISTRIBUTIONS[rp.fatDistribution]) s.physique.fatDistribution = rp.fatDistribution;
    const legacyList = fromV1 ? (Array.isArray(raw.garments) ? raw.garments : []) : ((raw.legacy && Array.isArray(raw.legacy.garments)) ? raw.legacy.garments : []);
    if (!fromV1 && Array.isArray(raw.garments)) raw.garments.forEach(rg => { try { s.garments.push(sanitizeGarment(rg)); } catch (e) { warnings.push(s.name + ': a garment could not be loaded (' + e.message + ').'); } });
    if (legacyList.length) {
        let ok = 0; const left = [];
        legacyList.forEach(og => { const g = og && convertLegacyGarment(og); if (g) { s.garments.push(g); ok++; } else left.push(og); });
        if (ok) warnings.push(s.name + ': converted ' + ok + ' garment(s) from the old format. Check their size and fit.');
        if (left.length) { s.legacy = { garments: left }; warnings.push(s.name + ': ' + left.length + ' old garment(s) could not be matched to the catalog and were kept aside.'); }
    }
    if (Array.isArray(raw.layerOrder)) s.layerOrder = raw.layerOrder.filter(id => typeof id === 'string');
    if (Array.isArray(raw.layerUpper) && Array.isArray(raw.layerLower)) { s.layerUpper = raw.layerUpper.filter(id => typeof id === 'string'); s.layerLower = raw.layerLower.filter(id => typeof id === 'string'); }
    else { s.layerUpper = null; s.layerLower = null; }
    syncLayerOrder(s);
    if (raw.phaseMotion && typeof raw.phaseMotion === 'object') ['phase3', 'phase4'].forEach(pid => {
        const pm = raw.phaseMotion[pid]; if (!pm || typeof pm !== 'object') return;
        const kfs = Array.isArray(pm.keyframes) ? pm.keyframes.filter(k => k && typeof k.label === 'string' && num(k.start) !== null && num(k.end) !== null && k.joints && typeof k.joints === 'object')
            .map(k => ({ label: k.label, phrase: String(k.phrase || ''), start: Number(k.start), end: Number(k.end), joints: Object.fromEntries(Object.entries(k.joints).filter(([j, v]) => POSTURE_JOINTS.some(x => x.key === j) && num(v) !== null).map(([j, v]) => [j, Number(v)])) })) : [];
        s.phaseMotion[pid] = { text: typeof pm.text === 'string' ? pm.text : '', keyframes: kfs, readText: typeof pm.readText === 'string' ? pm.readText : '' };
    });
    return s;
}

/* Accepts v1 (old simulator) or v2 data; returns { subjects:[], warnings:[], activeSubjectId }. */
function migrateData(raw) {
    const warnings = [];
    if (!raw || typeof raw !== 'object') throw new Error('File is not a valid simulator data file.');
    if (raw.formatVersion === FORMAT_VERSION && Array.isArray(raw.subjects)) {
        const wardrobe = Array.isArray(raw.wardrobe) ? raw.wardrobe.filter(w => w && w.garment).map(w => { try { const g = sanitizeGarment(w.garment); delete g.id; return { id: typeof w.id === 'string' ? w.id : uid('ward'), name: String(w.name || g.name), garment: g }; } catch (e) { return null; } }).filter(Boolean) : [];
        return { subjects: raw.subjects.map(s => sanitizeSubject(s, warnings, false)), warnings, activeSubjectId: raw.activeSubjectId, wardrobe };
    }
    if ((raw.formatVersion === 1 || raw.formatVersion === undefined) && raw.subjects && typeof raw.subjects === 'object' && !Array.isArray(raw.subjects)) {
        const order = Array.isArray(raw.subjectOrder) ? raw.subjectOrder : Object.keys(raw.subjects);
        const subjects = order.filter(id => raw.subjects[id]).map(id => sanitizeSubject(raw.subjects[id], warnings, true));
        warnings.unshift('Converted from the older simulator format (v1).');
        return { subjects, warnings, activeSubjectId: null };
    }
    if (typeof raw.formatVersion === 'number' && raw.formatVersion > FORMAT_VERSION) throw new Error('This file was made by a newer version of the simulator (format ' + raw.formatVersion + ').');
    throw new Error('Unrecognized file format.');
}

function loadSubjectsIntoState(result, replace) {
    if (replace) { state.subjects = {}; state.subjectOrder = []; state.wardrobe = []; }
    (result.wardrobe || []).forEach(w => { if (!state.wardrobe.some(x => x.id === w.id)) state.wardrobe.push(w); });
    result.subjects.forEach(s => {
        if (state.subjects[s.id]) s.id = uid('subj'); // avoid id clashes when adding alongside
        state.subjects[s.id] = s; state.subjectOrder.push(s.id);
    });
    state.activeSubjectId = (result.activeSubjectId && state.subjects[result.activeSubjectId]) ? result.activeSubjectId
        : (result.subjects[0] ? result.subjects[0].id : state.subjectOrder[0]);
}

function loadInitialData() {
    let embedded = null, local = null;
    try { const t = document.getElementById('embeddedData').textContent.trim(); if (t && t !== 'null') embedded = JSON.parse(t); } catch (e) { embedded = null; }
    try { const t = localStorage.getItem(LS_KEY); if (t) local = JSON.parse(t); } catch (e) { local = null; }
    let chosen = null, label = '';
    if (embedded && local) {
        chosen = (Date.parse(local.savedAt || 0) >= Date.parse(embedded.savedAt || 0)) ? local : embedded;
        label = chosen === local ? 'Loaded your latest browser save' : 'Loaded data built into this file';
    } else if (embedded) { chosen = embedded; label = 'Loaded data built into this file'; }
    else if (local) { chosen = local; label = 'Loaded your latest browser save'; }
    if (!chosen) return null;
    try {
        const result = migrateData(chosen);
        loadSubjectsIntoState(result, true);
        return label + (chosen.savedAt ? ' (' + new Date(chosen.savedAt).toLocaleString() + ')' : '');
    } catch (e) {
        return 'Saved data could not be loaded: ' + e.message;
    }
}

function downloadBlob(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportJson() {
    downloadBlob(JSON.stringify(serializeState(), null, 2), 'oozaru-tf-data.json', 'application/json');
    showToast('Exported ' + state.subjectOrder.length + ' subject(s)');
}

function saveCopyOfSimulator() {
    const json = JSON.stringify(serializeState()).replace(/</g, '\\u003c');
    const re = /(<script type="application\/json" id="embeddedData">)[\s\S]*?(<\/script>)/;
    if (!re.test(PRISTINE_HTML)) { showToast('Could not build the copy (data block not found).', 'err'); return; }
    const html = PRISTINE_HTML.replace(re, (whole, open, close) => open + json + close);
    const d = new Date(); const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    downloadBlob(html, 'oozaru-tf-simulator-' + stamp + '.html', 'text/html');
    showToast('Saved a copy of the simulator with ' + state.subjectOrder.length + ' subject(s) built in');
}

/* =========================================================================

function showToast(msg, kind) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(() => t.classList.remove('show'), kind === 'err' ? 5000 : 2800);
}

function el(tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(k => {
        if (attrs[k] === undefined || attrs[k] === null || attrs[k] === false) return;
        if (k === 'class') e.className = attrs[k];
        else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
        else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(c => { if (c !== null && c !== undefined && c !== false) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
}

function showModal(title, message, actions) {
    const root = document.getElementById('modalRoot');
    root.innerHTML = '';
    const close = () => { root.innerHTML = ''; };
    const overlay = el('div', { class: 'modal-overlay', onclick: (ev) => { if (ev.target === overlay) close(); } });
    const box = el('div', { class: 'modal-box', role: 'dialog', 'aria-modal': 'true' }, [el('h2', {}, [title]), el('p', {}, [message])]);
    const row = el('div', { class: 'modal-actions' });
    actions.forEach(a => row.appendChild(el('button', { class: 'btn ' + (a.cls || ''), onclick: () => { close(); if (a.fn) a.fn(); } }, [a.label])));
    box.appendChild(row);
    overlay.appendChild(box);
    root.appendChild(overlay);
}

function srcTag(src) {
    if (src === 'entered') return el('span', { class: 'src-tag ent' }, ['entered']);
    if (src === 'est') return el('span', { class: 'src-tag est' }, ['estimated']);
    if (src === 'calc') return el('span', { class: 'src-tag calc' }, ['calculated']);
    return null;
}

   ========================================================================= */

function renderSubjectTabs() {
    const wrap = document.getElementById('subjectTabs');
    wrap.innerHTML = '';
    state.subjectOrder.forEach(id => {
        const subj = state.subjects[id];
        const on = id === state.activeSubjectId;
        const tabWrap = el('div', { class: 'subj-tab-wrap' + (on ? ' on' : '') });
        tabWrap.appendChild(el('button', { class: 'subj-tab', onclick: () => { state.activeSubjectId = id; scheduleSave(); renderAll(); } }, [subj.name || '(unnamed)']));
        if (state.subjectOrder.length > 1) {
            tabWrap.appendChild(el('button', { class: 'subj-tab-x', title: 'Remove subject', 'aria-label': 'Remove ' + subj.name,
                onclick: (ev) => { ev.stopPropagation(); confirmRemoveSubject(id); } }, ['\u00d7']));
        }
        wrap.appendChild(tabWrap);
    });
    wrap.appendChild(el('button', { class: 'subj-add', title: 'Add subject', 'aria-label': 'Add subject', onclick: addSubject }, ['+']));
}

function addSubject() {
    const s = makeBlankSubject('Subject ' + (state.subjectOrder.length + 1));
    state.subjects[s.id] = s; state.subjectOrder.push(s.id); state.activeSubjectId = s.id;
    scheduleSave(); renderAll(); showToast('Subject added');
}
function confirmRemoveSubject(id) {
    const s = state.subjects[id];
    showModal('Remove subject?', 'This permanently removes "' + s.name + '" and all of its data from this browser. Export first if you want to keep a copy.', [
        { label: 'Cancel' },
        { label: 'Remove', cls: 'del', fn: () => {
            state.subjectOrder = state.subjectOrder.filter(x => x !== id); delete state.subjects[id];
            if (state.activeSubjectId === id) state.activeSubjectId = state.subjectOrder[0];
            scheduleSave(); renderAll(); showToast('Subject removed');
        } },
    ]);
}

function renderSubjectToolbar() {
    const wrap = document.getElementById('subjectToolbar');
    const subj = getActiveSubject(); if (!subj) return;
    let nameInput = document.getElementById('subjNameInput');
    if (!nameInput) {
        wrap.innerHTML = '';
        nameInput = el('input', { class: 'subj-name-input', id: 'subjNameInput', type: 'text', maxlength: '60', 'aria-label': 'Subject name' });
        nameInput.addEventListener('input', (ev) => { const s = getActiveSubject(); s.name = ev.target.value; scheduleSave(); renderSubjectTabs(); refreshLive(); });
        wrap.appendChild(nameInput);
        wrap.appendChild(el('span', { id: 'badgeComplete' }));
        wrap.appendChild(el('span', { id: 'badgeValid' }));
        wrap.appendChild(el('span', { id: 'badgeGarm' }));
        wrap.appendChild(el('div', { class: 'spacer' }));
    }
    if (document.activeElement !== nameInput) nameInput.value = subj.name;
    updateToolbarBadges(validatePhysique(subj));
}
function updateToolbarBadges(v) {
    const subj = getActiveSubject();
    const comp = getSubjectCompleteness(subj);
    const b1 = document.getElementById('badgeComplete'), b2 = document.getElementById('badgeValid');
    if (!b1 || !b2) return;
    b1.className = 'badge ' + (comp.complete ? 'complete' : 'incomplete');
    b1.textContent = comp.complete ? 'PHYSIQUE COMPLETE' : 'PHYSIQUE ' + comp.done + '/' + comp.total;
    b2.className = 'badge ' + (v.errors.length ? 'error' : 'complete');
    b2.textContent = v.errors.length ? v.errors.length + ' PROBLEM' + (v.errors.length === 1 ? '' : 'S') : 'NO CONFLICTS';
    const b3 = document.getElementById('badgeGarm');
    if (b3) {
        const gv = validateGarments(subj);
        const n = subj.garments.length;

/* ---- Feet + inches entry (height, foot length). Stored internally as inches (height) or cm (foot). ---- */
function toInches(f, stored) { return stored === null ? null : (f.ftin.storedAs === 'cm' ? stored / 2.54 : stored); }
function fmtFtIn(totalIn) {
    let ft = Math.floor(totalIn / 12 + 1e-9); let inch = +(totalIn - ft * 12).toFixed(1);
    if (inch >= 12) { ft += 1; inch = +(inch - 12).toFixed(1); }
    return ft + ' ft ' + inch + ' in';
}
function fmtField(f, v) {
    if (f.ftin) { const inches = toInches(f, v); return fmtFtIn(inches) + ' (' + fmt(f.ftin.storedAs === 'cm' ? v : v * 2.54) + ' cm)'; }
    return v + (f.unit ? ' ' + f.unit : '');
}
function renderFtInField(subj, f) {
    const m = subj.physique.measurements;
    const inches = toInches(f, num(m[f.key]));
    const ftVal = inches === null ? '' : String(Math.floor(inches / 12 + 1e-9));
    const inVal = inches === null ? '' : String(+(inches - Math.floor(inches / 12 + 1e-9) * 12).toFixed(2));
    const fld = el('div', { class: 'fld' });
    fld.appendChild(el('label', { for: 'f-m-' + f.key }, [f.label, ' ', el('span', { class: 'req-dot', 'aria-label': 'required' }, ['●'])]));

    const inIn = el('input', { type: 'number', step: 'any', min: '0', id: 'f-m-' + f.key + '-in', inputmode: 'decimal', value: inVal, 'aria-label': f.label + ' inches', class: inches === null ? 'empty' : '' });
    const update = () => {

        let total = null;

        m[f.key] = total === null ? null : (f.ftin.storedAs === 'cm' ? +(total * 2.54).toFixed(3) : +total.toFixed(3));
        ftIn.classList.toggle('empty', total === null); inIn.classList.toggle('empty', total === null);

    };
    ftIn.addEventListener('input', update); inIn.addEventListener('input', update);
    row.appendChild(ftIn); row.appendChild(el('span', {}, ['ft'])); row.appendChild(inIn); row.appendChild(el('span', {}, ['in']));
    fld.appendChild(row);
    fld.appendChild(el('div', { class: 'unit-suffix', id: 'sfx-m-' + f.key }, ['feet and inches (decimals OK, e.g. 6.1 ft or 6 ft 1 in)']));
    return fld;
}

function renderDescriptorField(subj, regionKey, f) {

    ]));
    const select = el('select', { class: 'dv' + (entry === null ? (f.optional ? '' : ' empty') : (validIdx === null ? ' bad' : '')), id: 'f-d-' + regionKey + '-' + f.key });
    const estOf = () => { const e = f.optional && f.estimate ? f.estimate(subj) : null; return e && f.options[e.i] ? e : null; };
    const est0 = estOf();

        const input = document.getElementById('f-m-' + f.key), tag = document.getElementById('tag-m-' + f.key);
        const r = R[f.key];
        if (input) input.placeholder = r && r.value !== null ? fmt(r.value, f.step === '0.001' ? 3 : 2) : 'needs height & torso';
        if (tag) { tag.innerHTML = ''; const t = srcTag(num(subj.physique.measurements[f.key]) !== null ? 'entered' : 'est'); if (t) tag.appendChild(t); }
        const sfx = document.getElementById('sfx-m-' + f.key);
        if (sfx) {
            const entered = num(subj.physique.measurements[f.key]) !== null;
            sfx.textContent = entered ? 'your value \u00b7 \u21ba to go back to the estimate'
                : (r && r.value !== null ? 'estimated ' + fmt(r.value, f.step === '0.001' ? 3 : 2) + ' \u2014 ' + AUTO_BASIS[f.key] : 'appears once height and torso length are entered');
        }
    });
    MEASUREMENT_FIELDS.filter(f => f.ftin).forEach(f => {
        const sfx = document.getElementById('sfx-m-' + f.key); if (!sfx) return;
        const v = posNum(subj.physique.measurements[f.key]);
        sfx.textContent = v ? '= ' + fmtField(f, v) : 'feet and inches (decimals OK, e.g. 6.1 ft or 6 ft 1 in)';
    });
    PHYSIQUE_SCHEMA.forEach(r => r.fields.forEach(f => {
        if (!f.optional || !f.estimate) return;
        const sel = document.getElementById('f-d-' + r.key + '-' + f.key); if (!sel) return;
        const e = f.estimate(subj); if (!e || !f.options[e.i]) return;
        sel.options[0].textContent = '\u2014 estimate: ' + f.options[e.i].label + ' \u2014';
    }));
    OVERRIDE_FIELDS.forEach(f => {
        const input = document.getElementById('f-o-' + f.key), tag = document.getElementById('tag-o-' + f.key);
        const r = R[f.key];
        if (input) input.placeholder = r && r.value !== null ? fmt(r.value) : (r && r.needs ? 'needs ' + r.needs : '\u2014');
        if (tag) { tag.innerHTML = ''; if (r && r.src !== 'needs') { const t = srcTag(r.src); if (t) tag.appendChild(t); } }
    });
    const dc = document.getElementById('derivedComputed');
    if (dc) { dc.innerHTML = ''; dc.appendChild(renderDerivedComputed(subj, v)); }

    PHYSIQUE_SCHEMA.forEach(region => {
        const badge = document.querySelector('.region-card[data-region="' + region.key + '"] .rcnt');
        if (!badge) return;
        const c = getRegionCompleteness(subj, region.key);
        badge.textContent = c.done + '/' + c.total;
        badge.classList.toggle('done', c.done === c.total);
        badge.classList.toggle('pending', c.done !== c.total);
    });
}

/* ---- Starting posture card (reused from v1, plus starting muscle tension) ---- */
function renderPostureCard(subj) {
    const card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'card-hdr' }, [el('h3', {}, ['Starting Pose'])]));
    const body = el('div', { class: 'card-body' });
    body.appendChild(el('div', { class: 'info' }, [
        'Describe how the subject is positioned when the transformation begins (e.g. "standing with arms crossed, fists clenched", or "semi-reclined on a hospital bed, legs straight, right arm across his stomach"). Left and right are read per phrase. ' +
        'Leave blank for the default: standing relaxed, arms at sides. Words like "tensed" or "clenched" make the starting body use ' +
        'flexed rather than relaxed values (arms, forearms, thighs, calves and chest).'
    ]));
    const textarea = el('textarea', { class: 'parser-box', 'aria-label': 'Starting pose description',
        placeholder: 'e.g. "Standing at ease, arms crossed loosely over his chest, weight shifted onto his left leg."' });
    textarea.value = subj.physique.postureParserText || '';
    textarea.addEventListener('input', (ev) => { subj.physique.postureParserText = ev.target.value; scheduleSave(); });
    body.appendChild(textarea);
    const btnRow = el('div', { style: 'display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;' });
    const parseBtn = el('button', { class: 'btn pri sm' }, ['Parse Pose']);
    const resetBtn = el('button', { class: 'btn sm' }, ['Reset to Neutral']);
    btnRow.appendChild(parseBtn); btnRow.appendChild(resetBtn);
    body.appendChild(btnRow);
    const reviewSlot = el('div', {});
    body.appendChild(reviewSlot);
    if (subj.physique.postureSource !== 'default' || subj.physique.startTension > 0) reviewSlot.appendChild(renderPostureCurrentState(subj));
    card.appendChild(body);

    parseBtn.addEventListener('click', () => {
        reviewSlot.innerHTML = '';
        const detected = parsePostureText(subj.physique.postureParserText);
        if (Object.keys(detected).length === 0) {
            reviewSlot.appendChild(el('div', { class: 'parser-review' }, ['No recognizable pose phrases found. Try describing specific limb positions (e.g. "arms crossed", "crouching", "knees pointing outward").']));
            return;
        }
        reviewSlot.appendChild(renderPostureReviewScreen(subj, detected, reviewSlot));
    });
    resetBtn.addEventListener('click', () => { resetPostureToNeutral(subj); scheduleSave(); showToast('Pose reset to neutral (standing relaxed, arms at sides)'); renderAll(); });
    return card;
}
function fmtPoseValue(k, v) { const j = POSTURE_JOINTS.find(x => x.key === k); if (j && j.unit === 'support') return POSE_SUPPORT_LABELS[v] || String(v); if (j && j.unit === 'frac') return Math.round(v * 100) + '%'; return v + '\u00b0'; }
function tensionLabel(v) { return v >= 1 ? 'tensed' : (v > 0 ? 'partly tensed' : 'relaxed'); }
function renderPostureReviewScreen(subj, detected, reviewSlot) {
    const box = el('div', { class: 'parser-review' });
    box.appendChild(el('div', { style: 'font-size:12px; font-weight:600; color:var(--ambl); margin-bottom:6px;' }, ['Detected \u2014 review before applying:']));
    Object.keys(detected).forEach(k => {
        const d = detected[k];
        const row = el('div', { class: 'parser-review-row' });
        if (k === '__tension') { row.appendChild(el('span', { class: 'prj' }, ['Starting muscle tension'])); row.appendChild(el('span', { class: 'prv' }, [tensionLabel(d.value)])); }
        else if (k === '__unread') return;
        else { const j = POSTURE_JOINTS.find(j => j.key === k); row.appendChild(el('span', { class: 'prj' }, [j.label])); row.appendChild(el('span', { class: 'prv' }, [fmtPoseValue(k, d.value)])); }
        row.appendChild(el('span', { class: 'prc' }, ['from: "' + d.phrase + '"']));
        box.appendChild(row);
    });
    if (detected.__unread && detected.__unread.length) box.appendChild(el('div', { class: 'muted', style: 'margin-top:6px' }, ['Not read as a body position (so it changes nothing): ' + detected.__unread.map(x => '“' + x + '”').join('; ')]));
    { const prev = Object.assign({}, subj.physique.posture); Object.keys(detected).forEach(k => { if (k[0] !== '_') prev[k] = detected[k].value; });
      box.appendChild(el('div', { style: 'margin-top:6px; font-size:12px' }, ['Reads as: ' + poseSummary(prev) + '.'])); }
    const actionRow = el('div', { style: 'display:flex; gap:8px; margin-top:10px;' });
    actionRow.appendChild(el('button', { class: 'btn pri sm', onclick: () => { resetPostureToNeutral(subj, true); applyPostureOverrides(subj, detected); scheduleSave(); showToast('Pose applied'); renderAll(); } }, ['Accept All']));
    actionRow.appendChild(el('button', { class: 'btn sm', onclick: () => { reviewSlot.innerHTML = ''; } }, ['Discard']));
    box.appendChild(actionRow);
    return box;
}
function renderPostureCurrentState(subj) {
    const box = el('div', { class: 'parser-review' });
    box.appendChild(el('div', { style: 'font-size:12px; font-weight:600; color:var(--grn); margin-bottom:6px;' }, ['Current starting pose (' + subj.physique.postureSource + '): ' + poseSummary(subj.physique.posture)]));
    box.appendChild(el('div', { class: 'muted', style: 'margin-bottom:6px' }, ['Every joint the simulation tracks. Change a number to fine-tune; the right-hand column says what it affects.']));
    POSTURE_JOINTS.forEach(j => {
        const v = subj.physique.posture[j.key];
        const row = el('div', { class: 'parser-review-row' });
        row.appendChild(el('span', { class: 'prj' }, [j.label]));
        let inp;
        if (j.unit === 'support') { inp = el('select', {}, Object.keys(POSE_SUPPORT_LABELS).map(k => { const o = el('option', { value: k }, [POSE_SUPPORT_LABELS[k]]); if (Number(k) === Number(v)) o.selected = true; return o; })); }
        else inp = el('input', { type: 'number', step: j.unit === 'frac' ? '0.1' : '5', min: String(j.min), max: String(j.max), value: String(v), style: 'width:72px' });
        inp.addEventListener('change', () => { const n = Number(inp.value); if (!isFinite(n)) return; subj.physique.posture[j.key] = clampToJointROM(j.key, n); subj.physique.postureParserCitations[j.key] = null; subj.physique.postureSource = 'parsed'; scheduleSave(); renderAll(); });
        row.appendChild(el('span', { class: 'prv' }, [inp, j.unit ? '' : '\u00b0']));
        const c = subj.physique.postureParserCitations[j.key];
        row.appendChild(el('span', { class: 'prc' }, [(v === j.neutral && !c ? 'default' : c ? 'from: "' + c + '"' : 'set by hand') + ' · ' + (POSE_JOINT_USE[j.key] || '')]));
        box.appendChild(row);
    });
    const tr = el('div', { class: 'parser-review-row' });
    tr.appendChild(el('span', { class: 'prj' }, ['Starting muscle tension']));
    tr.appendChild(el('span', { class: 'prv' }, [tensionLabel(subj.physique.startTension)]));
    tr.appendChild(el('span', { class: 'prc' }, [subj.physique.tensionCitation ? 'from: "' + subj.physique.tensionCitation + '"' : 'default']));
    box.appendChild(tr);
    return box;
}

    const key = JSON.stringify([ctx.circ, ctx.foot, ctx.hand, ctx.crotch, ctx.armscye, g.family, g.cut, g.fit, g.edges, g.features, g.shoe && g.shoe.system, g.fabric, g.zoneFit, g.zoneMeasured, g.waistband]);

    const a = autoSizeFor(s, g, ctx); if (!a) return;
    if (g.family === 'footwear') { if (a.shoeSize !== null) { g.shoe.size = a.shoeSize; g.shoe.width = a.shoeWidth; } g._autoWhy = a.why; return; }
    if (g.family === 'bottom' && g.inseamAuto !== false && (g.edges.legEnd === 'ankle' || g.inseam)) g.inseam = a.inseam;
    const sizes = SIZE_CHARTS[chartKeyFor(g)].sizes;
    let i = a.idx; g.size = sizes[i];
    while (i < sizes.length - 1) {
        const m = buildGarmentModel(s, g, ctx);
        if (!(m.errors || []).some(e => AUTO_STEP_UP_RE.test(e.message))) break;
        i++; g.size = sizes[i];
    }
    g._autoWhy = a.why + (i > a.idx ? '; ' + (i - a.idx) + ' size' + (i - a.idx > 1 ? 's' : '') + ' up so it can be put on' : '');
}

/* Weight a garment hangs on its supports: its own fabric (weight per area x the area it covers, plus linings),
   what it carries (armor plates, a loaded pack or belt) and what is in its pockets. Estimates. */
function garmentMassKg(g, ctx) {
    const fp = computeFabric(g.fabric); if (!fp.ok || !ctx || !ctx.ok) return { self: 0, carried: 0, pockets: 0, total: 0 };
    const H = ctx.heights, gsm = num(g.fabric.gsm) || 200, e = g.edges || {}, f = g.features || {};
    let area = 0;   // cm^2
    if (g.family === 'top' || g.family === 'onepiece') {
        const hemH = g.family === 'onepiece' ? H.crotch : Math.max(hemHeight(ctx, e.hem || 'hip'), H.crotch);
        area += 1.15 * ctx.circ.chest * (H.shoulder - hemH);
        const se = e.sleeveEnd; if (se && se !== 'none') area += 2 * 1.2 * ctx.circ.armRelaxed * sleeveEndPos(ctx, se);
        if (f.hood) area += 1500;
    }
    if (g.family === 'bottom' || g.family === 'underwear' || g.family === 'onepiece') {
        const rH = g.family === 'onepiece' ? H.waist : riseHeight(ctx, e.rise || 'hipBones');
        area += 1.1 * ctx.circ.hip * (rH - H.crotch) + 2 * 1.1 * 0.75 * ctx.circ.thigh * legDepthFor(g, ctx);
        if (f.bib) area += 0.25 * ctx.circ.chest * (H.chest - rH) + 2 * 4 * 2 * (H.shoulder - rH);
    }
    if (g.family === 'vest') area += 1.0 * ctx.circ.chest * 0.45 * ctx.T;
    if (g.family === 'wrap') area += 1.3 * ctx.circ.hip * (riseHeight(ctx, e.rise || 'waist') - H.crotch + legEndDepth(ctx, e.legEnd || 'knee'));
    if (g.family === 'cape') area += f.capeKind === 'poncho' ? 2 * 140 * 100 : 3.2 * ctx.circ.chest * 0.6 * ctx.T;
    const l = g.linings || {};
    let kg = area * gsm / 1e7 * (1 + (l.lined ? 0.35 : 0) + (l.insulated ? 0.6 : 0));
    const pockets = g.pocketContents ? Object.values(g.pocketContents).reduce((a, k) => a + ((POCKET_ITEMS[k] || {}).kg || 0), 0) : 0;
    const carried = num(g.carryKg) || 0;
    return { self: kg, carried, pockets, total: kg + carried + pockets };
}

function deriveSeams(g, ctx, model) {

    const L = [];
    const l = g.linings || {};
    if (l.interfacing) L.push({ key: 'interfacing', label: 'Interfacing in collar, cuffs and placket', fabric: presetFabric('interfacing'), zones: ['collar', 'sleeveEndL', 'sleeveEndR', 'placket', 'frontOpening'] });
    if (l.lined) L.push({ key: 'lining', label: 'Full body lining', fabric: presetFabric('satin_lining'), zones: ['frontChestUpper', 'frontChestLower', 'backChest', 'midsection', 'hem', 'upperSleeveL', 'upperSleeveR', 'lowerSleeveL', 'lowerSleeveR'] });
    if (l.insulated) L.push({ key: 'insulation', label: 'Insulation fill', fabric: presetFabric('insulation'), zones: ['frontChestUpper', 'frontChestLower', 'backChest', 'midsection', 'hem', 'upperSleeveL', 'upperSleeveR'] });
    if (g.reinforcements && g.reinforcements.doubleKnee) L.push({ key: 'doubleKnee', label: 'Second fabric layer at the knees', fabric: g.fabric, zones: ['kneeL', 'kneeR'] });

}

function putOnChecks(g, ctx, model, err) {
    const z = {}; model.zones.forEach(r => z[r.key] = r);
    if (['top', 'onepiece', 'vest'].includes(g.family) && ctx.circ.shoulders) {
        const chest = ['frontChestLower', 'backChest', 'frontPanel'].map(k => z[k]).filter(r => r && r.garment);
        if (chest.length) {
            const Gsh = Math.max(...chest.map(r => r.garment)) * ANTHRO.shoulderToChest, need = ctx.circ.shoulders + (chest[0].layerExtra || 0);
            const strain = need / Gsh - 1, limit = chest[0].props.ok ? chest[0].props.across.elastic : 0.05;
            model.shoulderStart = { garment: Gsh, body: need, strain };
            if (strain > limit) err(g.name + ': too narrow across the shoulders. It is cut for about ' + fmt(Gsh, 0) + ' cm around the shoulders but his measure ' + fmt(need, 0) + ' cm, past what the fabric can stretch at rest (' + fmt(limit * 100, 0) + '%). Choose a larger size or a looser fit.', 'size');
        }
    }
    if (['top', 'onepiece'].includes(g.family) && ctx.armscye && g.edges && g.edges.sleeveEnd && g.edges.sleeveEnd !== 'none') {
        const ch = ['frontChestLower', 'backChest'].map(k => z[k]).filter(r => r && r.garment);
        const ah = model.seams.find(sm => sm.kind === 'armhole');
        if (ch.length && ah) {
            const Gah = Math.max(...ch.map(r => r.garment)) * ANTHRO.armscyeToChest, strain = ctx.armscye / Gah - 1;
            const limit = Math.max(ah.stretch, ch[0].props.ok ? ch[0].props.across.elastic : 0.05);
            model.armholeStart = { garment: Gah, body: ctx.armscye, strain };
            if (strain > limit) err(g.name + ': the armholes are too small for his shoulders and upper arms. They are cut for about ' + fmt(Gah, 0) + ' cm around, his armhole measures ' + fmt(ctx.armscye, 0) + ' cm' + (ctx.R.armscyeCirc && ctx.R.armscyeCirc.src === 'est' ? ' (estimated; enter a measured Armhole in Physique \u2192 Calculated Body if it\u2019s wrong)' : '') + '. Choose a larger size or a looser fit.', 'size');
        }
    }
    const maxOpen = (row) => row && row.garment && row.props.ok ? row.garment * (1 + row.props.across.elastic) : null;
    const est = (k, field) => ctx.estimated[k] ? ' (' + field + ' is estimated; enter a measured value in Physique → Calculated Body → ' + field + ' if it’s wrong)' : '';
    const f = g.features || {};
    if ((g.family === 'top' || g.family === 'onepiece') && f.opening !== 'fullFront' && !f.wrapFront && z.collar && z.collar.garment) {
        let open = maxOpen(z.collar) || 0;
        if (f.opening === 'placket') open += 2 * 12;
        if (f.neckline === 'v') open += 2 * 10;
        if (f.neckline === 'scoop') open += 2 * 6;
        if (open < ctx.circ.head) err(g.name + ': the neck opening can stretch to at most ' + fmt(open) + ' cm, but head circumference is ' + fmt(ctx.circ.head) + ' cm. It couldn’t be pulled over the head. Choose a larger size, a stretchier collar, or add an opening.', 'size');
    }
    ['L', 'R'].forEach(sd => {
        const c = z['sleeveEnd' + sd];
        if (c && g.edges.sleeveEnd === 'wrist' && c.garment) {
            let open = maxOpen(c) || 0;
            if (f.cuff === 'button' || f.cuff === 'french') open += 2 * 7;
            if (open < ctx.hand.circ) err(g.name + ': the ' + (sd === 'L' ? 'left' : 'right') + ' cuff can open to ' + fmt(open) + ' cm, but the hand is ' + fmt(ctx.hand.circ) + ' cm around' + est('handCirc', 'Hand Circumference') + '.', 'size');
        }
        const lo = z['legOpening' + sd];
        if (lo && lo.garment && legDepthFor(g, ctx) >= ctx.calfD) {
            const open = maxOpen(lo) || 0;
            const need = ctx.foot.heelGirth * BODY_GEOM.pointedFootPassage;
            if (open < need) err(g.name + ': the ' + (sd === 'L' ? 'left' : 'right') + ' leg opening can stretch to ' + fmt(open) + ' cm, but a pointed foot needs about ' + fmt(need) + ' cm (heel girth ' + fmt(ctx.foot.heelGirth) + ' cm' + est('heelGirth', 'Heel Girth') + '). The foot couldn\u2019t pass through.', 'size');
        }
        const gc = z['gloveCuff' + sd];
        if (gc && gc.garment) { const open = maxOpen(gc); if (open < ctx.hand.circ) err(g.name + ': glove cuff opens to ' + fmt(open) + ' cm, hand is ' + fmt(ctx.hand.circ) + ' cm' + est('handCirc', 'Hand Circumference') + '.', 'size'); }
    });
    if (z.waistband && z.waistband.garment && g.family !== 'wrap') {
        let open = maxOpen(z.waistband) || 0;
        const flyF = model.fasteners.find(x => x.id === 'fly_zip');
        if (flyF) open += 2 * flyF.lengthCm * 0.6;
        else if (model.fasteners.some(x => x.zone === 'fly')) open += 2 * 10;
        if (open < ctx.circ.hip) err(g.name + ': the waistband (with the fly open) reaches ' + fmt(open) + ' cm, but the hips are ' + fmt(ctx.circ.hip) + ' cm. It couldn’t be pulled up over the hips.', 'size');
    }
    if (z.band && g.family === 'headwear' && z.band.garment) { const open = maxOpen(z.band); if (open < ctx.circ.head) err(g.name + ': head opening reaches ' + fmt(open) + ' cm; head is ' + fmt(ctx.circ.head) + ' cm.', 'size'); }
}

/* =========================================================================
   SECTION: SUBJECT-LEVEL GARMENT RESOLUTION
   Layer order, layer thickness, tucking and belts all depend on more than
   one garment, so they're worked out here for the whole outfit.
   ========================================================================= */

/* Layering is set in two lists: upper body (head down to the hip bones) and lower body (hip bones down).
   Garments that span both (one-pieces, bib overalls) sit in both lists with a position in each.
   Where the halves meet at the waist, a top's tuck setting decides: untucked hangs over every lower-body
   garment; tucked goes under the waistband it is tucked into (and whatever is over that) and over what is under it.
   s.layerOrder (one innermost-to-outermost order) is worked out from these for everything else to use. */
const UPPER_FAMILIES = ['top', 'vest', 'headwear', 'neckwear', 'handwear', 'rigidBand', 'cape', 'pack', 'suspenders'];
const LOWER_FAMILIES = ['underwear', 'bottom', 'belt', 'wrap', 'socks', 'footwear'];
function layerHalves(g) {
    if (g.family === 'onepiece' || (g.family === 'bottom' && g.features && g.features.bib)) return ['upper', 'lower'];
    return UPPER_FAMILIES.includes(g.family) ? ['upper'] : LOWER_FAMILIES.includes(g.family) ? ['lower'] : ['upper'];
}
/* Where a new garment goes in a list: base layers (T-shirts, tanks, thermals) under shirts and polos, those under sweaters, then jackets */
function listRank(g) {
    const r = g.layerRank || 1;
    if (g.family === 'top' && /T-Shirt|\bTee\b|Tank|A-Shirt|Undershirt|Thermal|Compression|Base Layer|Singlet|Rash Guard|Long Johns/i.test(g.name)) return 0.9;
    if (g.family === 'top' && g.tuck && g.tuck.mode !== 'untucked') return r + 1;   // tucked rank is only lower so it sits under the pants
    return r;
}
function insertByRankIn(list, s, g) {
    const idx = list.findIndex(id => { const o = s.garments.find(x => x.id === id); return o && listRank(o) > listRank(g); });
    if (idx < 0) list.push(g.id); else list.splice(idx, 0, g.id);
}
/* The waistband a tucked top goes into, from the lower list: the outermost pants or shorts, else the outermost underwear */
function tuckTargetFromLists(s, g) {
    if (!g.tuck || g.tuck.mode === 'untucked' || g.family !== 'top') return null;
    const byId = (id) => s.garments.find(x => x.id === id);
    if (g.tuck.target && g.tuck.target !== 'auto') return byId(g.tuck.target) ? g.tuck.target : null;
    const lower = (s.layerLower || []).map(byId).filter(Boolean);
    const pants = lower.filter(o => o.family === 'bottom'); if (pants.length) return pants[pants.length - 1].id;
    const und = lower.filter(o => o.family === 'underwear'); return und.length ? und[und.length - 1].id : null;
}
function syncLayerOrder(s) {
    if (!Array.isArray(s.layerOrder)) s.layerOrder = [];
    const ids = new Set(s.garments.map(g => g.id)), byId = (id) => s.garments.find(x => x.id === id);
    // files from before the split: seed both lists from the single order
    if (!Array.isArray(s.layerUpper) || !Array.isArray(s.layerLower)) {
        s.layerUpper = []; s.layerLower = [];
        s.layerOrder.filter(id => ids.has(id)).forEach(id => { const g = byId(id); layerHalves(g).forEach(h => (h === 'upper' ? s.layerUpper : s.layerLower).push(id)); });
    }
    ['layerUpper', 'layerLower'].forEach(k => { s[k] = s[k].filter((id, i, a) => ids.has(id) && a.indexOf(id) === i && layerHalves(byId(id)).includes(k === 'layerUpper' ? 'upper' : 'lower')); });
    s.garments.forEach(g => layerHalves(g).forEach(h => { const L = h === 'upper' ? s.layerUpper : s.layerLower; if (!L.includes(g.id)) insertByRankIn(L, s, g); }));
    s.layerOrder = linearLayerOrder(s);
}
/* One order from the two lists and the tuck rule (innermost first) */
function linearLayerOrder(s) {
    const G = s.garments, byId = (id) => G.find(x => x.id === id);
    const U = s.layerUpper, L = s.layerLower;
    const edges = new Map(); G.forEach(g => edges.set(g.id, new Set()));
    const before = (a, b) => { if (a !== b && edges.has(a) && edges.has(b)) edges.get(a).add(b); };
    [U, L].forEach(list => list.forEach((id, i) => { if (i) before(list[i - 1], id); }));
    const upperOnly = U.filter(id => !L.includes(id)), lowerOnly = L.filter(id => !U.includes(id));
    upperOnly.forEach(tid => {
        const t = byId(tid); if (!t) return;
        if (t.family === 'suspenders') { lowerOnly.forEach(bid => { const b = byId(bid); if (b && (b.family === 'bottom' || b.family === 'underwear')) before(bid, tid); }); return; }
        if (t.family !== 'top' && t.family !== 'vest') return;
        const target = t.family === 'top' ? tuckTargetFromLists(s, t) : null, ti = target ? L.indexOf(target) : -1;
        lowerOnly.forEach(bid => {
            const b = byId(bid); if (!b || !['underwear', 'bottom', 'wrap', 'belt'].includes(b.family)) return;
            if (ti >= 0) { if (L.indexOf(bid) >= ti) before(tid, bid); else before(bid, tid); }
            else before(bid, tid);   // untucked: hangs over every waistband
        });
    });
    // topological order; ties go to the lower default rank, then list position
    const indeg = new Map(); G.forEach(g => indeg.set(g.id, 0)); edges.forEach(set => set.forEach(b => indeg.set(b, indeg.get(b) + 1)));
    const key = (id) => { const g = byId(id); const u = U.indexOf(id), l = L.indexOf(id); return [g ? listRank(g) : 1, Math.max(u, l)]; };
    const cmp = (a, b) => { const x = key(a), y = key(b); return x[0] - y[0] || x[1] - y[1]; };
    const out = [], left = new Set(G.map(g => g.id));
    while (left.size) {
        let ready = [...left].filter(id => indeg.get(id) === 0);
        if (!ready.length) ready = [...left];   // conflicting choices: fall back to rank
        ready.sort(cmp);
        const id = ready[0]; out.push(id); left.delete(id);
        edges.get(id).forEach(b => indeg.set(b, indeg.get(b) - 1));

}

function garmentCoverage(g, ctx) {
    const H = ctx.heights, e = g.edges || {}, cov = {};
    const se = e.sleeveEnd;
    if (g.family === 'top' || g.family === 'onepiece') {
        cov.torso = [g.family === 'onepiece' ? H.crotch : Math.max(hemHeight(ctx, e.hem || 'hip'), H.crotch), H.shoulder];
        if (se && se !== 'none') cov.arm = [0, sleeveEndPos(ctx, se)];
        cov.neck = (g.features || {}).neckline !== 'v' && (g.features || {}).neckline !== 'scoop';
        if ((g.features || {}).hood) cov.headHood = true;
        if ((g.features || {}).hoodUp && g.features.hoodUp !== 'down') cov.head = true;
    }
    if (g.family === 'bottom' || g.family === 'underwear' || g.family === 'onepiece') {
        const top = g.family === 'onepiece' ? H.shoulder : riseHeight(ctx, e.rise || 'hipBones');
        cov.torso = cov.torso ? [Math.min(cov.torso[0], H.crotch), Math.max(cov.torso[1], top)] : [H.crotch, top];
        cov.leg = [0, legDepthFor(g, ctx)];
    }
    if (g.family === 'vest') cov.torso = [H.waist, H.shoulder];
    if (g.family === 'belt') { const h = g._beltH || H.hipBones; cov.torso = [h - (g.belt ? g.belt.widthCm : 3.5), h]; }
    if (g.family === 'footwear') { cov.foot = true; if (g.shoe && g.shoe.shaft !== 'low') cov.leg = [g.shoe.shaft === 'ankle' ? ctx.ankleD - 4 : g.shoe.shaft === 'midCalf' ? ctx.calfD : ctx.kneeD + 3, ctx.ankleD + 12]; }
    if (g.family === 'headwear') cov.head = true;
    if (g.family === 'handwear') cov.hand = true;
    if (g.family === 'socks') { cov.foot = true; const ht = e.sockHeight || 'crew'; const d = ht === 'knee' ? ctx.kneeD + 6 : ht === 'crew' ? ctx.ankleD - 0.35 * (ctx.ankleD - ctx.calfD) : ctx.ankleD; if (ht !== 'noShow') cov.leg = [d - 2, ctx.ankleD + 12]; }
    if (g.family === 'neckwear') cov.neck = true;
    if (g.family === 'bottom' && (g.features || {}).bib && cov.torso) cov.torso[1] = Math.max(cov.torso[1], g.features.bib.front === 'chest' ? ctx.heights.chest - 5 : cov.torso[1]);
    if (g.family === 'wrap') { cov.torso = [ctx.heights.crotch, riseHeight(ctx, e.rise || 'waist')]; cov.leg = [0, legEndDepth(ctx, e.legEnd || 'knee')]; }
    return cov;
}
function coversSite(cov, site) {
    if (site.seg === 'torso') return !!cov.torso && site.h >= cov.torso[0] - 0.01 && site.h <= cov.torso[1] + 0.01;
    if (site.seg === 'arm') return !!cov.arm && site.s >= cov.arm[0] && site.s <= cov.arm[1] + 0.01;
    if (site.seg === 'leg' || site.seg === 'legs') return !!cov.leg && site.d >= cov.leg[0] && site.d <= cov.leg[1] + 0.01;
    if (site.seg === 'neck') return !!cov.neck;
    if (site.seg === 'head') return !!cov.head;
    if (site.seg === 'hand' || site.seg === 'wrist') return !!cov.hand;
    if (site.seg === 'foot') return !!cov.foot;
