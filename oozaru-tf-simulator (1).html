function overlaps(a, b) {
    const iv = (x, y) => x && y && Math.min(x[1], y[1]) - Math.max(x[0], y[0]) > 0.5;
    const parts = [];
    if (iv(a.torso, b.torso)) parts.push('torso');
    if (iv(a.arm, b.arm)) parts.push('arms');
    if (iv(a.leg, b.leg)) parts.push('legs');
    if (a.foot && b.foot) parts.push('feet');
    if (a.head && b.head) parts.push('head');
    if (a.hand && b.hand) parts.push('hands');
    return parts;
}

function resolveSubjectGarments(s) {
    syncLayerOrder(s);
    const ctx = bodyContext(s);
    const out = { ctx, models: {}, errors: [], missing: [], layers: {} };
    const byId = {}; s.garments.forEach(g => byId[g.id] = g);
    if (!ctx.ok) {
        s.garments.forEach(g => { const m = buildGarmentModel(s, g, ctx); out.models[g.id] = m; m.missing.forEach(x => out.missing.push({ gid: g.id, label: g.name + ' → ' + x.label, field: x.field })); });
        return out;
    }
    s.garments.forEach(g => applyAutoSize(s, g, ctx));
    const order = s.layerOrder.map(id => byId[id]).filter(Boolean);

    // Belts: which garment they go through, and where they sit.
    const beltInfo = {};
    order.forEach((g, i) => {
        if (g.family !== 'belt') return;
        const lowers = order.slice(0, i).filter(o => (o.family === 'bottom' || o.family === 'onepiece') && o.family !== 'belt');
        let target = g.belt && g.belt.through !== 'auto' ? byId[g.belt.through] : lowers[lowers.length - 1];
        if (g.belt && g.belt.through !== 'auto' && (!target || !lowers.includes(target))) { out.errors.push({ gid: g.id, field: 'belt', message: g.name + ': the garment it’s worn through must be a pair of pants, shorts or a one-piece listed before (under) it in the layer order.' }); target = null; }
        if (!target) { if (g.belt && g.belt.through === 'auto') out.errors.push({ gid: g.id, field: 'belt', message: g.name + ': there are no pants, shorts or one-piece under it to wear it through.' }); return; }
        const h = target.family === 'onepiece' ? ctx.heights.waist : riseHeight(ctx, (target.edges && target.edges.rise) || 'hipBones');
        g._beltH = h;
        beltInfo[g.id] = { target, h };
    });

    // Suspenders: which pants or shorts they clip or button to, and where that waistband sits
    order.forEach((g, i) => {
        if (g.family !== 'suspenders') return;
        delete g._suspH;
        const lowers = order.slice(0, i).filter(o => o.family === 'bottom');
        const thr = (g.features && g.features.through) || 'auto';
        let target = thr !== 'auto' ? byId[thr] : lowers[lowers.length - 1];
        if (thr !== 'auto' && (!target || !lowers.includes(target))) { out.errors.push({ gid: g.id, field: 'features', message: g.name + ': the pants they attach to must be listed before (under) them in the layer order.' }); target = null; }
        if (!target) { if (thr === 'auto') out.errors.push({ gid: g.id, field: 'features', message: g.name + ': there are no pants or shorts under them to attach to.' }); return; }
        g._suspH = riseHeight(ctx, (target.edges && target.edges.rise) || 'hipBones');
    });

    const coverage = {}; order.forEach(g => coverage[g.id] = garmentCoverage(g, ctx));
    const thick = {}; order.forEach(g => thick[g.id] = garmentLayerThickness(g));

    order.forEach((g, i) => {
        const inner = order.slice(0, i);
        const layerExtra = (site) => inner.reduce((acc, o) => acc + (coversSite(coverage[o.id], site) ? 2 * Math.PI * thick[o.id] : 0), 0);
        const opts = { layerExtra };
        if (beltInfo[g.id]) {
            const tm = out.models[beltInfo[g.id].target.id];
            const site = { seg: 'torso', h: beltInfo[g.id].h };
            const wb = tm && tm.zones.find(z => z.key === 'waistband' || z.key === 'midsection');
            const under = Math.max(wb && wb.garment ? wb.garment : 0, torsoAt(ctx, site.h) + layerExtra(site));
            opts.beltSite = site; opts.beltBase = under + 2 * Math.PI * thick[beltInfo[g.id].target.id];
        }
        const m = buildGarmentModel(s, g, ctx, opts);
        out.models[g.id] = m;
        m.errors.forEach(e => out.errors.push({ gid: g.id, field: e.field, message: e.message }));
        m.missing.forEach(x => out.missing.push({ gid: g.id, label: g.name + ' → ' + x.label, field: x.field }));

        // Layer summary
        const over = [], under = [];
        order.forEach((o, j) => { if (o === g) return; const parts = overlaps(coverage[g.id], coverage[o.id]); if (!parts.length) return; (j < i ? over : under).push(o.name + ' (' + parts.join(', ') + ')'); });
        const touchesSkin = [];
        ['torso', 'arm', 'leg'].forEach(k => { if (coverage[g.id][k] && !inner.some(o => coverage[o.id][k] && overlaps({ [k]: coverage[g.id][k] }, { [k]: coverage[o.id][k] }).length)) touchesSkin.push(k === 'arm' ? 'arms' : k === 'leg' ? 'legs' : k); });
        out.layers[g.id] = { position: i + 1, over, under, touchesSkin };
    });

    // Tucking
    order.forEach(g => {
        if (!(g.family === 'top') || !g.tuck || g.tuck.mode === 'untucked') return;
        const hemH = hemHeight(ctx, (g.edges && g.edges.hem) || 'hip');
        const candidates = order.filter(o => (o.family === 'bottom' || o.family === 'underwear') && riseHeight(ctx, (o.edges && o.edges.rise) || 'hipBones') >= hemH - 0.5);
        let target = null;
        if (g.tuck.target === 'auto') { const lo = (s.layerLower || []).map(id => byId[id]).filter(o => o && candidates.includes(o)); const pants = lo.filter(o => o.family === 'bottom'); target = pants.length ? pants[pants.length - 1] : (lo.length ? lo[lo.length - 1] : candidates[candidates.length - 1] || null); }
        else { target = byId[g.tuck.target]; if (target && !candidates.includes(target)) { out.errors.push({ gid: g.id, field: 'tuck', message: g.name + ': can’t be tucked into ' + target.name + ', whose waistband sits below the shirt’s hem.' }); target = null; } }
        if (!target && g.tuck.target === 'auto') out.errors.push({ gid: g.id, field: 'tuck', message: g.name + ' is set to tucked, but there’s no pants, shorts or underwear waistband at or above its hem to tuck into.' });
        if (target) { out.models[g.id].tuckTarget = target.name; out.models[g.id].tuckTargetId = target.id; }
    });
    return out;
}

function validateGarments(s) {
    const r = resolveSubjectGarments(s);
    return { errors: r.errors.map(e => ({ message: e.message, target: { type: 'g', gid: e.gid, field: e.field } })),
             missing: r.missing.map(x => ({ label: x.label, target: { type: 'g', gid: x.gid, field: x.field } })), resolved: r };
}

/* =========================================================================
   SECTION: FIT DESCRIPTION PARSER (local rules; zone-aware)
   Turns "tight across the chest, loose at the waist, pecs visibly outlined"
   into per-zone fit levels and outline requirements, for review first.
   ========================================================================= */

const FIT_ZONE_WORDS = [
    { re: /\b(chest|pecs?|pectorals?)\b/i, zones: ['frontChestUpper', 'frontChestLower', 'backChest', 'frontPanel', 'backPanel'], label: 'chest' },
    { re: /\b(forearms?)\b/i, zones: ['lowerSleeveL', 'lowerSleeveR'], label: 'forearms' },
    { re: /\b(arms?|biceps?|upper arms?|sleeves?)\b/i, zones: ['upperSleeveL', 'upperSleeveR', 'sleeveEndL', 'sleeveEndR', 'underarmL', 'underarmR'], label: 'arms' },
    { re: /\b(shoulders?|armpits?)\b/i, zones: ['underarmL', 'underarmR'], label: 'shoulders' },
    { re: /\b(waist|stomach|belly|midsection|abs|tummy|gut)\b/i, zones: ['midsection', 'hem', 'waistband', 'sideCinch'], label: 'waist' },

    return result;
}

function sanitizeGarment(raw) {

    const base = entry ? garmentFromCatalog(entry) : makeGarmentFromDefaults(familyDefaults(fam, raw.cut), String(raw.name || 'Garment'), null);
    const g = base;
    if (typeof raw.id === 'string') g.id = raw.id;

    if (raw.cut === 'womens' || raw.cut === 'mens') g.cut = raw.cut;
    if (Number.isInteger(raw.seed)) g.seed = raw.seed;
    if (typeof raw.size === 'string' || typeof raw.size === 'number') g.size = String(raw.size);

    g.inseamAuto = typeof raw.inseamAuto === 'boolean' ? raw.inseamAuto : num(raw.inseam) === null;
    if (num(raw.inseam) !== null) g.inseam = num(raw.inseam);
    if (FIT_LEVELS[raw.fit]) g.fit = raw.fit;
    ['zoneFit', 'zoneMeasured', 'trims', 'zoneCondition', 'seamOverrides', 'fastenerState', 'edited', 'reinforcements', 'linings'].forEach(k => { if (raw[k] && typeof raw[k] === 'object' && !Array.isArray(raw[k])) g[k] = Object.assign({}, g[k], raw[k]); });
    Object.keys(g.zoneFit).forEach(k => { if (!FIT_LEVELS[g.zoneFit[k]]) delete g.zoneFit[k]; });
    Object.keys(g.zoneMeasured).forEach(k => { if (num(g.zoneMeasured[k]) === null) delete g.zoneMeasured[k]; });
    Object.keys(g.trims).forEach(k => { g.trims[k] = sanitizeFabric(g.trims[k], presetFabric('rib_trim')); });
    if (typeof raw.fitText === 'string') g.fitText = raw.fitText;

    g.fabric = sanitizeFabric(raw.fabric, g.fabric);

    if (raw.edges && typeof raw.edges === 'object') g.edges = Object.assign({}, g.edges, raw.edges);
    if (raw.fly === null || (raw.fly && typeof raw.fly === 'object')) g.fly = raw.fly ? Object.assign({}, g.fly || {}, raw.fly) : null;
    if (typeof raw.underwearFly === 'string') g.underwearFly = raw.underwearFly;
    if (raw.waistband === 'rigid' || raw.waistband === 'elastic') g.waistband = raw.waistband;
    if (raw.drawstring === null || (raw.drawstring && typeof raw.drawstring === 'object')) g.drawstring = raw.drawstring;
    if (FASTENER_SIZES[raw.fastenerSize]) g.fastenerSize = raw.fastenerSize;

    if (typeof raw.unbreakable === 'boolean') g.unbreakable = raw.unbreakable;

    return g;
}

}

    const curve = rescaledSigmoid(k);
    return { valueAt: (t) => t <= tStart ? from : t >= tStart + duration ? to : from + (to - from) * curve.at((t - tStart) / duration) };
}

            if (r.open && r.role === 'hood') { r.gone = true; r.state = 'destroyed'; if (!gr.hoodDown) { gr.hoodDown = true; emit(gr, 'hoodDown', r.label, 'With its drawstring gone, the hood slides back off his head.', { severity: 1 }); } return; }

                if (cl >= 1 && cl >= mr) {

            const sens = ENG.speedSens[r.props.group] || 0.03;

                if (r.ratio >= 1 && !r.open) { r.open = true; r.openReason = r.toeCap ? 'toe cap cracked' : 'shell cracked'; r.tearAt = t; emit(gr, 'crack', r.label, (r.toeCap ? 'The toe cap cracks' : 'The shell cracks') + ' under ' + fmt(epsTotal * 100) + '% compression.', { ring: r.id, severity: 3, ratio: r.ratio }); }

                if (e2 >= Lr.fail) { Lr.torn = true; if (!gr['_tornLayer_' + Lr.key]) { gr['_tornLayer_' + Lr.key] = true; emit(gr, 'liningTear', r.label, (Lr.key === 'interfacing' ? 'The stiffening inside the ' : Lr.key === 'doubleKnee' ? 'The inner knee layer of the ' : 'The lining inside the ') + r.label.toLowerCase() + ' tears.', { ring: r.id, severity: 1 }); } }
            });
            const { fA, fL } = ringRatioDetails(r);
            const rA = epsTotal / fA * r.tip, rL = Math.max(0, epsLT) / fL;
            r.ratioA = rA; r.ratioL = rL;
            r.ratio = (rA > 0.5 && rL > 0.5) ? Math.sqrt(rA * rA + rL * rL) : Math.max(rA, rL);
            // creep / sustained-load fatigue
            if (r.ratio > 0.5) r.fatigue = Math.min(1, r.fatigue + dt * (ENG.creep[r.props.behavior] || 0.1) * Math.pow(r.ratio - 0.5, 2));
            r.peakCycle = Math.max(r.peakCycle, r.ratio);
            // fabric tear
            if (r.ratio >= 1 && !r.tearDir) { r.tearDir = rL > rA ? 'H' : 'V'; r.tearAt = t; if (!gr.firstTearAt) gr.firstTearAt = t;
                if (r.isLength) { openRing(gr, r, t, gr.family === 'handwear' ? 'the fingertips burst through the ends of the fingers' : gr.family === 'socks' ? 'the toes pushed through the end of the sock' : 'the toes pushed through the front of the toe box', emit); return; }
                emit(gr, 'tearStart', r.label, (r.tearDir === 'V' ? 'A split opens and starts running along the body' : 'A tear opens and starts running around the body') + ', the fabric past its breaking point (' + fmt((r.tearDir === 'V' ? epsTotal : epsLT) * 100, 0) + '% stretch).', { ring: r.id, severity: 3, ratio: r.ratio, dir: r.tearDir }); }
        });

        // ---- Tears grow; rings open ----
        gr.rings.forEach(r => {
            if (r.gone || !r.tearDir || (!gr.heldOn && !r.remnant)) return;
            const drive = Math.max(r.ratio, r.open ? 0.95 : 0);
            // a tear that has started keeps creeping under less load than it took to start it (fabric tears far more
            // easily than it breaks), until the load falls below ENG.tearCreep.floor of the breaking point

            const knit = r.props.group === 'knit';

            if (r.tearDir === 'V') r.tearV = Math.min(r.bandH, r.tearV + v * dt);
            else {
                const Gc = r.G0 * (1 + r.plastic), stop = ENG.tearArrest.seamAt * Gc;
                const crossing = !r.open && gr.seams.some(sm => !sm.parallel && !sm.failed && sm.rings.includes(r.id));
                if (crossing && r.tearH < stop && r.tearH + v * dt >= stop && r.ratio < ENG.tearArrest.passRatio) {
                    r.tearH = stop;
                    if (!r.arrested) { r.arrested = true; emit(gr, 'tearArrest', r.label, 'The tear running around the ' + r.label.toLowerCase() + ' stops at the side seam, where the doubled seam allowance holds it, for now.', { ring: r.id, severity: 1 }); }
                } else {
                    if (crossing && r.tearH >= stop - 1e-6 && r.tearH < stop + 2) v *= 0.5;

                }
            }
            // past half-way round, what is left of the ring carries double load and goes at once
            if (!r.open && ((r.tearDir === 'V' && r.tearV >= r.bandH - 1e-6) || (r.tearDir === 'H' && r.tearH >= 0.5 * r.G0 * (1 + r.plastic)))) openRing(gr, r, t, r.tearDir === 'V' ? (r.tearSource === 'tail' ? 'split through from the hole the tail made' : 'split through') : 'torn all the way around', emit);
        });

        // ---- Seams ----
        gr.seams.forEach(sm => {
            if (sm.failed || (!gr.heldOn)) return;
            let force = 0, stretchR = 0;
            const rings = sm.rings.map(id => gr.rings.find(r => r.id === id)).filter(r => r && !r.gone);
            if (!sm.parallel) {
                rings.forEach(r => { force = Math.max(force, r.T); stretchR = Math.max(stretchR, Math.max(0, r.epsL) / sm.stretch); });
            } else if (sm.role === 'hang') {
                const Lt = gr.length.top; const TL = Lt ? (gr.modAlongBody || (mainRing ? mainRing.props.modL : 0)) * Lt.eps : 0;
                const nHang = gr.seams.filter(x => x.role === 'hang' && !x.failed).length || 1;
                force = TL + (tr.shrugP || 0) * 0.02 * (mainRing ? mainRing.props.modL : 0) * (1 + (tr.trapFactor || 0)) + (gr.loadKg || 0) * 9.81 / nHang / sm.lengthCm;
                stretchR = Lt ? (Lt.eps + 0.02 * (tr.shrugP || 0)) / sm.stretch : 0;
                // the seam runs across the top of the shoulder: it lengthens as the shoulders broaden
                const Mb = run.body.M, grow = 0.5 * Mb.shoulders + 0.5 * Mb.clavicle;
                const hb = ctx.habit || { rounding: 0 };
                let widen;
                if (gr.shoulderG && ctx.circ.shoulders) {
                    const extra = (1 + ENG.habit.roundingAcrossBack * Math.max(0, hb.rounding)) * (1 + 0.02 * (tr.shrugP || 0)) * (1 + ENG.habit.slopeAcross * Math.max(0, -(ctx.slope || 0)));
                    // around the shoulders (muscle) and straight across them (bone, shoulder tip to tip) both pull the seam; averaged
                    const byCirc = ctx.circ.shoulders * (ctx.acrossBackFactor || 1) * grow * extra / gr.shoulderG - 1;
                    const byWidth = ctx.shoulderWidth ? ctx.shoulderWidth * grow * extra / (gr.shoulderG / ANTHRO.shoulderToChest * ANTHRO.biacromialToChest) - 1 : byCirc;
                    widen = Math.max(0, 0.5 * byCirc + 0.5 * byWidth);
                }
                else widen = Math.max(0, grow / (1 + ENG.shoulderEase) - 1);

                // the across-back fabric and the seam share the mismatch; the seam goes when the larger of the two limits is passed

            } else {
                rings.forEach(r => { force = Math.max(force, r.TL); stretchR = Math.max(stretchR, r.eps / sm.stretch); });
                // the armhole seam runs around his armhole: it is stretched as the shoulders and upper arms grow past what it was cut for

            }

        // ---- Weak points ----

                if (w.type === 'collarBand') { const sm = gr.seams.find(x => x.kind === 'collar'); if (sm) sm.split = Math.max(sm.split, 0.5); emit(gr, 'weakPoint', w.label, 'The collar starts to pull away from the shirt body at the collar band.', { severity: 2 }); return; }
                if (w.type === 'flyBase') { const sm = gr.seams.find(x => x.key === 'frontRise'); if (sm) sm.split = Math.max(sm.split, 0.5); emit(gr, 'weakPoint', w.label, 'The base of the fly starts to give under the forward load.', { severity: 2 }); return; }

                if (!r.tearDir) { r.tearDir = 'V'; r.tearAt = t; if (!gr.firstTearAt) gr.firstTearAt = t; }

            }
        });

        // ---- Thigh-contact wear & arm pinch ----
        if (opts.thighOverlap > 0) { const addF = 1 + SHAPE_EFFECTS.adductorWear * Math.max(0, (ctx.shape && ctx.shape.adductor) || 0); gr.rings.filter(r => r.role === 'leg' && /^thigh/.test(r.zoneKeys[0])).forEach(r => r.fatigue = Math.min(1, r.fatigue + dt * ENG.thigh.frictionWear * opts.thighOverlap * addF)); }
        if (opts.pinch > 0) gr.rings.filter(r => /^underarm/.test(r.zoneKeys[0])).forEach(r => r.fatigue = Math.min(1, r.fatigue + dt * ENG.pinchWear * opts.pinch));

        // ---- States, exposure ----
        gr.rings.forEach(r => {
            if (r.gone) return;
            if (!gr.exempt && !r.rigid && !r.toeCap) {
                const A = r.props.across;
                let st = 'intact';
                if (r.epsTotal > A.onset || r.epsL > r.props.along.onset) st = 'strained';
                if (r.plastic > 0.002) st = 'yielding';
                if (r.tearDir || r.tearV > 0 || r.tearH > 0) st = 'torn';
                if (r.open && (r.tearV > 0 || r.tearH > 0 || r.openReason)) st = r.openReason && /start|buckled/.test(r.openReason) && !r.tearDir ? st : 'partiallyFailed';
                r.state = st;
            }
            const area = Math.max(1, r.G0 * (1 + r.plastic) * r.bandH);
            const tearArea = r.tearV * Math.max(0.5, r.gap || r.eps * r.G0 * 0.3) + r.tearH * Math.min(r.bandH, 2 + Math.max(0, r.epsL) * 20);

        });

        // ---- Shoes: the sole can't widen and the heel counter can't open, so a spreading foot cracks them ----
        if (gr.family === 'footwear' && gr.shoe && gr.heldOn && !gr.exempt) {
            const sole = RIGID_MATERIALS[gr.shoe.sole], cup = RIGID_MATERIALS[gr.shoe.heelCounter];
            gr.shoeParts = gr.shoeParts || {};
            ['L', 'R'].forEach(sd => {
                const up = gr.rings.find(r => r.zoneKeys.includes('upper' + sd)); if (!up) return;
                const P = gr.shoeParts[sd] = gr.shoeParts[sd] || {};
                const spread = Math.max(0, up.B / up.G0 - 1);                  // how far the foot has outgrown the shoe's width
                // the heel cup is sized for the foot the shoe fits; his own heel girth (measured or estimated) grows with the foot
                const fits = shoeFootLength(gr.shoe.system, gr.shoe.size) || ctx.foot.length;
                const grow = Math.max(0, ctx.foot.heelGirth * (S.footBall() / ctx.foot.ballGirth) / (EST.heel(fits) * (SHOE_WIDTHS[gr.shoe.width] || 1)) - 1);

                    if (P.soleRatio >= 1) { P.soleCracked = true; gr.soleFailed = true; emit(gr, 'soleCrack', 'Sole — ' + (sd === 'L' ? 'Left' : 'Right'), 'The ' + sole.label.toLowerCase() + ' sole cracks as his foot spreads past its edges, and the upper tears loose from it.', { severity: 3, side: sd }); }
                }

        }
        // ---- Show-through: as the fabric pulls taut, the body's own definition shows through it (once per feature) ----
        if (gr.heldOn && !gr.exempt && run.outline && run.outline.length && (run.body.fur || 0) < 0.3) {
            gr.outlined = gr.outlined || {};
            const now = [];
            run.outline.forEach(o => {
                if (gr.outlined[o.k] || (o.hood && !gr.hoodStyle)) return;
                if (gr.rings.some(r => !r.open && !r.gone && r.zoneKeys.some(z => o.zones.includes(z.replace(/[LR]$/, ''))) && r.eps >= o.th && (!o.lowLeg || (r.site.seg === 'leg' && (r.site.d || 0) > ctx.kneeD)))) { gr.outlined[o.k] = true; now.push(o); }
            });

            if (gr.outlinePend && t - gr.outlinePend.t0 >= 0.3) { const l = gr.outlinePend.list.sort((a, b) => b.p - a.p).map(o => o.label); gr.outlinePend = null; emit(gr, 'outline', null, gr.name + ' is pulled taut enough to show ' + l.join(', ') + '.', { severity: 1, features: l }); }
        }

        // ---- Held on? ----
        if (gr.heldOn && !gr.exempt) {

            // torn too far to stay up by itself, but a layer over it still closes around the same part of him: it stays, pressed in place
            if (!why.held) {

                // only something that grips the same part of him can hold it there: pants over underwear, a fitted top or jacket over a shirt, shoes over socks
                const canHold = { bottom: ['bottom', 'onepiece', 'wrap'], underwear: ['bottom', 'onepiece', 'underwear', 'wrap'], top: ['top', 'onepiece', 'vest'], onepiece: ['onepiece'], vest: ['top', 'onepiece'], socks: ['footwear', 'socks'], headwear: ['headwear'], handwear: ['handwear'], wrap: ['bottom', 'onepiece', 'wrap'] }[gr.family] || [];
                const holder = outer.find(o => canHold.includes(o.family) && sites.some(st => coversSite(coverMap[o.id], st) &&
                    o.rings.some(r => !r.open && !r.gone && (r.eps || 0) > 0.001 && r.site.seg === st.seg && (st.seg !== 'torso' || Math.abs((r.site.h || 0) - (st.h || 0)) < 15) && (st.seg !== 'leg' || Math.abs((r.site.d || 0) - (st.d || 0)) < 25))));
                if (holder) {
                    if (!gr.trapped || gr.trapped.by !== holder.id) { gr.trapped = { by: holder.id, byName: holder.name, byFamily: holder.family, reason: why.reason, at: t };
                        emit(gr, 'trapped', null, gr.name + ' can no longer stay on by itself (' + why.reason + '), but ' + holder.name + ' over it still holds it in place.', { severity: 3, holderName: holder.name, holderFamily: holder.family, reason: why.reason }); }
                } else if (gr.trapped) { why = { held: false, reason: why.reason, released: gr.trapped.byName, releasedFamily: gr.trapped.byFamily }; gr.trapped = null; }
            } else if (gr.trapped) gr.trapped = null;
            if (!why.held && !gr.trapped) {
                gr.heldOn = false; gr.offAt = t; gr.offPhase = phaseId; gr.offReason = why.reason + (why.released ? ', and ' + why.released + ' is no longer there to hold it in place' : '');
                const legEnds = (gr.family === 'bottom' || gr.family === 'underwear') ? gr.rings.filter(r => !r.gone && !r.open && /^legOpening/.test(r.zoneKeys[0])) : [];

                    emit(gr, 'pooled', null, gr.name + ' slides down his legs and bunches around his ankles' + (legEnds.length < 2 ? ' (one leg)' : '') + '.', { severity: 2 });
                } else gr.rings.forEach(r => { if (!r.open && r.eps > 0.001 && !r.detachedLoose && r.role !== 'hood') { r.remnant = true; } else { r.gone = true; r.state = r.open ? 'destroyed' : 'failed'; r.exposed = 1; } });

}

function openRing(gr, r, t, reason, emit) {
    if (r.open) return;
    r.open = true; r.openReason = reason; r.openAt = t; r.tearAt = r.tearAt || t;
    if (!gr.firstTearAt) gr.firstTearAt = t;
    if (r.pocketItems && r.pocketItems.length && !r.pocketDropped) { r.pocketDropped = true; r.pocketCm = 0;
        const what = listJoinPlain(r.pocketItems.map(p => 'the ' + POCKET_ITEMS[p.item].name + ' in the ' + POCKET_SLOTS[p.slot].toLowerCase()));
        emit(gr, 'pocketDrop', r.label, capFirstPlain(what) + (r.pocketItems.length > 1 ? ' drop' : ' drops') + ' out through the split.', { ring: r.id, severity: 1, items: r.pocketItems.map(p => POCKET_ITEMS[p.item].name) }); }
    emit(gr, 'ringOpen', r.label, r.bandMat ? 'The ' + r.label.toLowerCase() + ' comes open (' + reason + ').' : 'The ' + r.label.toLowerCase() + ' is no longer a closed ring (' + reason + '); its tension drops and the fabric springs back.', { ring: r.id, severity: 3 });
    // the tear tip carries stress into the next ring of the same tube
    gr.rings.filter(x => x !== r && x.role === r.role && x.side === r.side && !x.open).forEach(x => { if (r.tearDir === 'V' && Math.abs((x.baseSite.h || 0) - (r.baseSite.h || 0)) < 40) { x.tip = Math.max(x.tip, ENG.tipConcentration); if (!x.tearDir && x.ratio > 0.7) { x.tearDir = 'V'; x.tearAt = t; } } });

    if (r.tearDir === 'H') {
        const L = gr.length;
        if (r.role === 'torso' && L.top) L.top.broken = true;
        if (r.role === 'seat') { if (L.backRise) L.backRise.broken = true; if (L.frontRise) L.frontRise.broken = true; }
        if (r.role === 'leg' && L['leg' + r.side]) L['leg' + r.side].broken = true;

}

function listJoinPlain(a) { if (a.length <= 1) return a[0] || ''; return a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
function capFirstPlain(x) { return x ? x.charAt(0).toUpperCase() + x.slice(1) : x; }

/* What keeps each kind of garment on the body (hanging supports + gripping rings). */
function heldOnCheck(gr, S, ctx, run) {
    const live = gr.rings.filter(r => !r.gone);
    const gripping = (r) => !r.open && !r.detached && r.eps > 0.001;
    const fam = gr.family;
    if (fam === 'footwear') {
        const open = live.filter(r => r.role === 'shoe' && r.open && !r.isLength);
        const toes = live.filter(r => r.isLength && r.open);
        if (gr.soleFailed) return { held: false, reason: 'the upper tore away from the sole' };
        if (gr.heelBurst) return { held: false, reason: 'the heel counter cracked and his heel burst out of the back' };
        if (open.length) return { held: false, reason: 'the upper burst open around the foot' };
        if (toes.length) return { held: false, reason: 'the toes burst through the front and the shoe is pushed off the heel' };
        return { held: true };
    }
    if (fam === 'headwear' && gr.hat && gr.hat.pushedOff) return { held: false, reason: 'his growing head pushed it up until it toppled off' };
    if (fam === 'headwear') return live.some(r => (r.role === 'band' || r.role === 'neck') && !r.open) || !live.some(r => r.role === 'band') ? { held: true } : { held: false, reason: live.some(r => r.role === 'neck') ? 'it split around both his head and his neck' : 'the band around the head split' };
    if (fam === 'handwear') return live.filter(r => r.role === 'hand' && r.open).length >= 2 ? { held: false, reason: 'both gloves burst' } : { held: true };
    if (fam === 'socks') {
        const sideOff = (sd) => live.some(r => r.side === sd && (r.role === 'sock' || r.role === 'sockLen') && r.open) || !live.some(r => r.side === sd && r.role === 'sock');
        const toes = live.filter(r => r.role === 'sockLen' && r.open).length >= 2;
        return sideOff('L') && sideOff('R') ? { held: false, reason: toes ? 'his toes burst through the ends of both socks and they split away' : 'both socks split open around the feet' } : { held: true };
    }
    if (fam === 'neckwear') { const r = live.find(x => x.role === 'neck'); return r && !r.open ? { held: true } : { held: false, reason: r && /fastener|slack/.test(r.openReason || '') ? 'the knot gave way and it slid from his neck' : 'the loop around his neck tore through' }; }
    if (fam === 'rigidBand') { const r = live.find(x => x.role === 'rband'); if (r && !r.open) return { held: true };
        const kind = r ? r.bandKind : 'watch', where = { watch: 'his wrist', bracelet: 'his wrist', ring: 'his finger', necklace: 'his neck', glasses: 'his face', headband: 'his head', wristband: 'his wrist' }[kind] || 'him';
        return { held: false, reason: (r && /clasp/.test(r.openReason || '') ? 'the clasp gave way' : r && /shatter/.test(r.openReason || '') ? 'it shattered' : kind === 'glasses' ? 'the frame snapped' : 'the band snapped') + ' and it fell from ' + where }; }
    if (fam === 'pack') {
        if (live.some(r => r.role === 'packCross')) return live.some(r => r.role === 'packCross' && !r.open) ? { held: true } : { held: false, reason: 'the strap let go and the bag dropped' };
        return live.some(r => r.role === 'packStrap' && !r.open) ? { held: true } : { held: false, reason: 'both shoulder straps let go' + (live.some(r => r.role === 'packHip' && !r.open) ? ', and a hip belt alone can\u2019t keep it upright' : '') };
    }
    if (fam === 'cape') { const r = live.find(x => x.role === 'capeNeck'); return r && !r.open ? { held: true } : { held: false, reason: r && /fastener/.test(r.openReason || '') ? 'the clasp at his throat gave way and it slid off his shoulders' : 'the neck opening tore through and it slid off his shoulders' }; }
    if (fam === 'suspenders') return live.some(r => r.role === 'susp' && !r.open) ? { held: true } : { held: false, reason: 'both straps let go' };
    if (fam === 'wrap') {
        const wb = live.find(r => r.role === 'waistband');
        if (wb && !wb.open && wb.G0 * (1 + wb.plastic) + (wb.slipUsed || 0) < S.torso(ctx.heights.hips)) return { held: true };
        return { held: false, reason: wb && wb.open ? (/fastener/.test(wb.openReason || '') ? 'the fastening at the waist gave way and the wrap fell open' : 'the wrapped waist tore through and the wrap fell open') : 'the wrap at his waist could slide down over his hips' };
    }
    if (fam === 'belt') return live.some(r => r.role === 'band' && !r.open) ? { held: true } : { held: false, reason: live.some(r => r.openReason === 'not buckled') ? 'it was never buckled and slid off' : 'the belt or its buckle failed' };
    const topHeld = () => {
        const hangs = gr.seams.filter(sm => sm.role === 'hang');
        const hangOk = hangs.length ? hangs.some(sm => !sm.failed) : false;
        const collarGrip = live.some(r => r.role === 'collar' && gripping(r) && !r.detached);
        // a band gripping only below the waist (a hem around the hips) is a scrap, not a shirt being worn
        // ...and a band left only around the waist, with the shoulders split and nothing closed at the chest, sleeves or neck, is a scrap too
        const upperClosed = live.some(r => ((r.role === 'torso' && r.baseSite.h >= ctx.heights.chest - 1) || r.role === 'collar' || r.role === 'sleeve') && !r.open && !r.detached);
        const torsoGrip = live.some(r => r.role === 'torso' && gripping(r) && r.baseSite.h >= ctx.heights.waist - 1) && (hangOk || upperClosed);
        // a closed loop (torso, sleeve or collar) keeps a garment hanging from the shoulders on the body
        const loop = live.some(r => (r.role === 'torso' || r.role === 'sleeve' || r.role === 'collar') && !r.open && !r.detached);
        // shoulders, collar and every sleeve gone: what is left is a band around the chest, a scrap rather than a worn top
        if (!hangOk && !collarGrip && !live.some(r => r.role === 'sleeve' && !r.open && !r.detached) && !live.some(r => r.role === 'sash' && !r.open)) {
            if (live.some(r => r.role === 'torso' && !r.open)) return { held: false, reason: 'the shoulders' + (gr.rings.some(r => r.role === 'collar') ? ', collar' : '') + (gr.rings.some(r => r.role === 'sleeve') ? ' and sleeves have all' : ' have') + ' torn away, leaving only a band of fabric around his chest' };
        }
        if (collarGrip || torsoGrip) return { held: true };
        if (hangOk && loop) return { held: true };
        // a wrap top tied at the waist stays on while the sash holds and it still hangs from the shoulders
        if (hangOk && live.some(r => r.role === 'sash' && !r.open)) return { held: true };
        if (!hangOk && live.some(r => r.role === 'torso' && gripping(r))) return { held: false, reason: 'the shoulders have split and the chest and sleeves have torn open, leaving only a band of fabric around his waist' };
        if (hangOk) return { held: false, reason: 'every loop of fabric around the torso, arms and neck has split, so what is left is loose panels draped over the shoulders that slide away' };
        return { held: false, reason: (hangs.length ? 'the shoulder seams have failed' : 'nothing holds it up') + ', the collar no longer grips the neck and no ring of fabric still grips the torso' };
    };

        const wb = live.find(r => r.role === 'waistband');
        const hipsB = S.torso(ctx.heights.hips);
        // a waistband near the hip bones must stretch a bit past the hip circumference to get over bony, square hips
        const ledge = wb && ctx.shape && Math.abs(wb.baseSite.h - ctx.heights.hipBones) < 6 ? SHAPE_EFFECTS.hipLedgeHold * ctx.shape.hipLedge : 0;

        const seats = live.filter(r => r.role === 'seat');

        const grip = seatGrip || (seatClosed && live.some(r => r.role === 'leg' && gripping(r)));
        // a belt (through the loops) and suspenders (clipped on) hold the pants up only while the waistband is still in one piece
        const wbWhole = wb && !wb.open && !gr.waistbandDetached;
        const belt = run && wbWhole && run.garments.find(o => o.family === 'belt' && o.heldOn && o.beltThrough === gr.id && o.rings.some(r => !r.open));
        // suspenders hold the pants up only while the waistband they clip to is still in one piece
        const susp = run && wb && !wb.open && !gr.waistbandDetached && run.garments.find(o => o.family === 'suspenders' && o.heldOn && o.attachedTo === gr.id && o.rings.some(r => !r.open));
        // overalls / bunker pants hang from their own shoulder straps while the seat holds together
        const straps = live.some(r => r.role === 'susp' && !r.open) && seatClosed;
        if (waistOk || grip || belt || susp || straps) return { held: true };
        if (live.some(r => r.role === 'susp' && !r.open)) return { held: false, reason: 'the seat has torn apart, so its shoulder straps are holding up nothing but scraps' };
        return { held: false, reason: (wb && (wb.open || gr.waistbandDetached) ? 'the waistband has broken' : 'the waistband can slide over the hips') + ' and no leg or seat ring still grips' + (live.some(r => r.role === 'susp') ? ', and its shoulder straps have let go' : '') };
    };
    if (fam === 'top' || fam === 'vest') return topHeld();
    if (fam === 'bottom' || fam === 'underwear') return bottomHeld();
    if (fam === 'onepiece') { const a = topHeld(), b = bottomHeld(); return (a.held || b.held) ? { held: true } : { held: false, reason: a.reason + '; ' + b.reason }; }
    return { held: true };
}

/* =========================================================================
   SECTION: TAIL (emerges at L5–S1; stiff base, flexible beyond; path of least resistance)
   ========================================================================= */

function stepTail(run, ctx, S, t, def, evts) {
    const tail = run.tail;
    const emit = (type, detail, extra) => evts.push(Object.assign({ t, type, garmentId: extra && extra.garmentId || null, garmentName: extra && extra.garmentName || null, part: 'Tail', detail, tail: true }, extra || {}));
    if (tail.status === 'free' || tail.length <= 0) return;
    const T = ENG.tail;
    const l5 = ctx.heights.l5s1;
    // Garments covering the tail's exit point, innermost first
    const covering = run.garments.filter(gr => gr.heldOn && !gr.destroyed && !gr.exempt && gr.rings.some(r => r.site.seg === 'torso' && !r.gone)).filter(gr => {
        const ts = gr.rings.filter(r => r.site.seg === 'torso' && !r.gone);
        const lo = Math.min(...ts.map(r => r.site.h - r.bandH / 2)), hi = Math.max(...ts.map(r => r.site.h + r.bandH / 2));
        const topExtends = gr.length.top && !gr.length.top.broken;

        return;
    }
    const gr = covering[0];
    const ringNear = gr.rings.filter(r => r.site.seg === 'torso' && !r.gone).sort((a, b) => Math.abs(a.site.h - l5) - Math.abs(b.site.h - l5))[0];
    const B = ringNear.B || S.torso(l5), G = ringNear.G0 * (1 + ringNear.plastic);
    const room = Math.max(0, (G - B) / (2 * Math.PI)) + 1;
    if (tail.blockedBy !== gr.id) { tail.blockedBy = gr.id; tail.decided = null; tail.coil = 0; tail.status = 'pressing'; tail.pushStart = tail.length;
        emit('tailMeets', 'The tail meets the ' + gr.name + ' from beneath.', { garmentId: gr.id, garmentName: gr.name, severity: 1 }); }
    const base = Math.min(tail.length, T.baseCm);
    // Existing opening right there? (a tear or open ring near the exit point)
    const openNear = gr.rings.find(r => r.site.seg === 'torso' && !r.gone && Math.abs(r.site.h - l5) < r.bandH && (r.open || r.tearV > 3 || r.tearH > 3));

    const A = ringNear.props.across, fail = A.fail * ringNear.condMult * Math.max(0.05, 1 - ringNear.fatigue);
    if (tent + ringNear.epsTotal >= fail) { punctureLayer(tail, gr, ringNear, 'the stiff base of the tail pushes straight through ' + gr.name + ' (' + fmt((tent + ringNear.epsTotal) * 100) + '% local stretch)', t, emit); return; }
    if (tail.length < T.baseCm) return;
    // Past the base: the flexible part follows the cheapest route
    if (!tail.decided) {
        const resistN = 2 * ringNear.props.modA * fail;
        const options = [{ kind: 'puncture', cost: resistN * T.punctureCostPerN }];

/* =========================================================================
   SECTION: PHASE MOTION (text -> timed pose keyframes)
   ========================================================================= */

function parseMotionKeyframes(text, phaseId) {
    const def = PHASE_DEFS[phaseId];
    if (!text || !text.trim()) return [];
    const groups = {};
    readPoseText(text, (typeof getActiveSubject === 'function' && getActiveSubject()) ? getActiveSubject().physique.posture : null).forEach(f => {
        if (!Object.keys(f.joints).length) return;
        const g = groups[f.clause] = groups[f.clause] || { label: f.label, phrase: f.phrase, index: f.index, joints: {} };
        if (g.label !== f.label && g.label.indexOf(f.label) < 0) g.label += ', ' + f.label;
        Object.assign(g.joints, f.joints);
    });
    const list = Object.values(groups).sort((a, b) => a.index - b.index);
    const start = phaseId === 'phase3' ? def.growth.from : def.stageA.from;
    const win = phaseId === 'phase3' ? 1.5 : 2;
    const end = phaseId === 'phase3' ? def.growth.to : def.stageA.to;
    return list.map((gp, i) => ({ label: gp.label, phrase: gp.phrase, joints: gp.joints, start: Math.min(start + i * win, end - 0.5), end: Math.min(start + (i + 1) * win, end) }));
}

    const p = Object.assign({}, startPosture);
    (keyframes || []).forEach(kf => {
        const prog = linearProgress(t, kf.start, kf.end);
        if (prog <= 0) return;
        Object.keys(kf.joints).forEach(j => { const from = p[j]; p[j] = clampToJointROM(j, from + (kf.joints[j] - from) * prog); });

/* =========================================================================

const QUOTED_INTERJECTIONS = ['“Ugh”', '“Ngh”', '“Gah”', '“Hnn”', '“Nnngh”'];

    breaking: ['a sound tears loose that catches and fractures mid-throat, cut short as his mouth reshapes around it',
        'whatever sound he makes breaks apart before it fully forms, his throat no longer built for words'],
    settling: ['a low growl rumbles up from somewhere deep in his chest', 'the sound that escapes him is closer to a growl now than anything human'],
    animal: ['a full-throated roar tears out of him, raw and enormous', 'what leaves him now is pure animal, no trace of a human voice left in it'],

function exportPhaseCsv(s, res) {
    const cols = ['t_phase_s', 't_overall_s'], getters = [(i) => fmt(res.times[i], 2), (i) => fmt(res.def.globalStart + res.times[i], 2)];

            }
        });
        body.appendChild(el('div', { class: 'ov-row' }, [el('div', { class: 'ov-name', title: g.name }, [cleanGarmentName(g.name)]), track]));
    });
    if (!s.layerOrder.length) body.appendChild(el('div', { class: 'muted' }, ['No garments — body-only transformation.']));
    card.appendChild(body);
    return card;
}

function phaseSummaryLine(s, res) {
    if (!res.ok) return 'failed';
    const u = resultsUI.units, h0 = res.body.height[0], h1 = res.body.height[res.steps];
    const n = Object.keys(res.garments).length, off = res.endState.garments.filter(g => !g.heldOn).length;
    return (Math.abs(h1 - h0) > 0.5 ? fmtHeight(h0, u).split(' (')[0] + ' → ' + fmtHeight(h1, u).split(' (')[0] + ' · ' : '') + (n ? off + '/' + n + ' garments off' : 'no garments') + ' · ' + res.events.filter(e => e.severity >= 3).length + ' failure events';
}

function renderPhaseSection(s, pid, res) {
    const key = s.id + pid;
    const isOpen = resultsUI.open[key] !== undefined ? resultsUI.open[key] : getResults(s).lastRun === pid;
    const det = el('details', { class: 'card gsec phase-sec', id: 'results-' + pid, open: isOpen ? 'open' : null, ontoggle: (ev) => { resultsUI.open[key] = ev.target.open; if (ev.target.open) setTimeout(() => redrawGroup(pid), 0); } });
    det.appendChild(el('summary', {}, [el('span', { class: 'car' }, ['▸']), PHASE_DEFS[pid].label, el('span', { class: 'garm-type', style: 'margin-left:auto;' }, [phaseSummaryLine(s, res)])]));
    const body = el('div', { class: 'gsec-body' });
    if (!res.ok) { body.appendChild(el('div', { class: 'info err-info' }, ['This phase stopped with an error and produced no results: ' + res.error])); det.appendChild(body); return det; }
    const d = res.def;
    const actions = el('div', { class: 'run-row', style: 'margin-bottom:10px;' }, [
        el('span', { class: 'garm-type' }, ['Phase time 0–' + d.duration + ' s · overall ' + d.globalStart + '–' + (d.globalStart + d.duration) + ' s · ' + res.steps + ' steps of ' + SIM_DT + ' s']),
        el('span', { class: 'spacer' }),
        el('button', { class: 'btn sm', onclick: () => exportPhaseCsv(s, res) }, ['Download CSV'])]);
    body.appendChild(actions);
    if (pid === 'phase3' && res.ruleCheck) body.appendChild(renderRuleCheck(s, res));
    body.appendChild(el('div', { class: 'grp-title' }, ['Body']));
    bodyChartGroups(pid).forEach(gp => body.appendChild(makeBodyChart(s, res, gp)));
    const startHeld = Object.keys(res.garments).filter(id => res.garments[id].heldOn[0]);
    if (Object.keys(res.garments).length) {
        body.appendChild(el('div', { class: 'grp-title' }, ['Garments']));
        if (!startHeld.length) body.appendChild(el('div', { class: 'muted', style: 'margin-bottom:10px;' }, ['Every garment was already off before this phase began.']));
        else body.appendChild(renderGarmentCharts(s, pid, res, startHeld));
    }
    body.appendChild(el('div', { class: 'grp-title' }, ['What happens']));
    body.appendChild(renderNarration(s, pid, res));
    det.appendChild(body);
    return det;
}

function renderRuleCheck(s, res) {
    const rc = res.ruleCheck;
    const card = el('div', { class: 'info ' + (rc.ok ? 'ok-info' : 'err-info') });
    card.appendChild(el('div', { style: 'font-weight:700;margin-bottom:4px;' }, [rc.ok ? '✓ Rule met: nothing is still held on by the end of Phase 3.' : '✕ Rule not met: something is still held on at the end of Phase 3, so Phase 4 can’t run.']));
    rc.rows.forEach(r => card.appendChild(el('div', {}, [cleanGarmentName(r.name) + ': ' + (r.exempt ? 'exempt (unbreakable) — not counted' : r.held ? 'still held on' : 'off at ' + fmt(r.offAt, 2) + ' s ' + (r.offPhase && r.offPhase !== 'phase3' ? 'into ' + PHASE_DEFS[r.offPhase].short + ' ' : '') + '(overall ' + fmt((r.offPhase ? PHASE_DEFS[r.offPhase].globalStart : res.def.globalStart) + r.offAt, 2) + ' s)')])));
    if (!rc.ok) { rc.detail.forEach(t => card.appendChild(el('div', { style: 'margin-top:4px;' }, [t]))); card.appendChild(el('div', { style: 'margin-top:6px;' }, ['To fix it: give that garment a smaller size or tighter fit, a weaker fabric, or mark it unbreakable (exempt) on the Garments tab if it is meant to survive.'])); }
    return card;
}

function bodyChartGroups(pid) {
    if (pid === 'phase1') return [{ title: 'Torso and arms during the pulses', keys: ['chest', 'waist', 'neck', 'upperArm'] }, { title: 'Shoulder lift', keys: ['shrug'], h: 120 }];
    if (pid === 'phase2') return [{ title: 'Upper body growth', keys: ['upperArm', 'forearm', 'chest', 'neck'] }, { title: 'Tail', keys: ['tail'], h: 130 }];
    if (pid === 'phase3') return [{ title: 'Height and lengths', keys: ['height', 'foot', 'tail'] }, { title: 'Torso', keys: ['chest', 'waist', 'hips', 'neck'] }, { title: 'Limbs and head', keys: ['upperArm', 'forearm', 'wrist', 'thigh', 'calf', 'head'] }];
    return [{ title: 'Height', keys: ['height'], h: 150, stage: true }, { title: 'Circumferences', keys: ['chest', 'waist', 'thigh', 'upperArm', 'neck', 'head'], stage: true }, { title: 'Tail length', keys: ['tail'], h: 130, stage: true }, { title: 'Tail thickness and fur depth', keys: ['tailDia', 'fur'], h: 130, stage: true }];
}
function phaseVlines(s, res) {
    const v = [];
    if (res.phaseId === 'phase4') v.push({ x: res.def.stageB.from, label: 'Stage B', color: 'rgba(192,132,252,.6)', dash: [5, 3] });
    const mk = resultsUI.marker[s.id + res.phaseId]; if (mk !== undefined) v.push({ x: mk, color: 'rgba(252,211,77,.9)', dash: [1, 0], label: '' });
    return v;
}
function makeBodyChart(s, res, gp) {
    const u = resultsUI.units, conv = (v) => u === 'in' ? v / 2.54 : v;
    const labels = Object.fromEntries(BODY_CHART_KEYS.map(([k, l]) => [k, l]));
    const series = gp.keys.map((k, i) => { const y = new Float32Array(res.steps + 1); for (let j = 0; j <= res.steps; j++) y[j] = conv(res.body[k][j]); return { label: labels[k], color: chartPalette(i), x: res.times, y }; });
    const cfg = { title: gp.title + ' (' + (u === 'in' ? 'in' : 'cm') + ')', series, xMin: 0, xMax: res.def.duration, vlines: phaseVlines(s, res), tipTime: (x) => fmt(x, 2) + ' s (overall ' + fmt(res.def.globalStart + x, 2) + ' s)', yUnit: '' };
    return makeChart(cfg, gp.h || 190, { group: res.phaseId });
}

function renderGarmentCharts(s, pid, res, ids) {
    const wrap = el('div', {});
    const tk = s.id + pid;
    if (!resultsUI.garmentTab[tk] || !ids.includes(resultsUI.garmentTab[tk])) resultsUI.garmentTab[tk] = ids[0];
    const tabs = el('div', { class: 'gtabs' });
    ids.forEach(id => { const g = res.garments[id]; const off = !g.heldOn[res.steps]; tabs.appendChild(el('button', { class: 'gtab' + (resultsUI.garmentTab[tk] === id ? ' on' : ''), onclick: () => { resultsUI.garmentTab[tk] = id; renderAll(); } }, [cleanGarmentName(g.name), off ? el('span', { class: 'gtab-off' }, [' off']) : null])); });
    wrap.appendChild(tabs);
    const id = resultsUI.garmentTab[tk], g = res.garments[id], gr = res.endState.garments.find(x => x.id === id);
    const offT = gr.offAt !== null && gr.offAt !== undefined && !g.heldOn[res.steps] ? (() => { for (let i = 0; i <= res.steps; i++) if (!g.heldOn[i]) return res.times[i]; return null; })() : null;
    wrap.appendChild(el('div', { class: 'note-line', style: 'margin:8px 0;' }, [offT !== null ? cleanGarmentName(g.name) + ' stopped being held on at ' + fmt(offT, 2) + ' s (overall ' + fmt(res.def.globalStart + offT, 2) + ' s): ' + (gr.offReason || '') + '.' : cleanGarmentName(g.name) + ' is still on at the end of this phase.' + (gr.exempt ? ' It is exempt (unbreakable).' : '')]));
    // which parts to plot: default = the 5 most loaded + anything that failed
    const peaks = g.parts.map((p, k) => { let mx = 0; const a = g.ratios[k]; for (let i = 0; i < a.length; i++) if (isFinite(a[i]) && a[i] > mx) mx = a[i]; return mx; });
    const selKey = tk + id;
    if (!resultsUI.partSel[selKey]) { const order = peaks.map((v, k) => [v, k]).sort((a, b) => b[0] - a[0]); const sel = new Set(order.slice(0, 5).map(x => x[1])); order.forEach(([v, k]) => { if (v >= 1) sel.add(k); }); resultsUI.partSel[selKey] = [...sel]; }
    const sel = resultsUI.partSel[selKey];
    const shade = offT !== null ? [{ x0: offT, x1: res.def.duration, color: 'rgba(239,68,68,0.08)' }] : [];
    const series = sel.map((k, i) => { const a = g.ratios[k], y = new Float32Array(a.length); for (let j = 0; j < a.length; j++) y[j] = a[j] * 100; return { label: g.parts[k].label, color: chartPalette(i), x: res.times, y, nanLabel: 'gone' }; });
    const markers = res.events.filter(e => e.garmentId === id && e.severity >= 3 && e.type !== 'off').map(e => ({ x: e.t, y: 100, color: '#f87171' }));
    const peakSel = sel.reduce((a, k) => Math.max(a, peaks[k]), 0);
    wrap.appendChild(makeChart({ title: '% of breaking point (100% = that part fails' + (peakSel > 2.5 ? '; lines above 250% are cut off at the top' : '') + ')', series, xMin: 0, xMax: res.def.duration, yMin: 0, yMax: Math.min(250, Math.max(110, peakSel * 105)), zeroBase: true, refLines: [{ y: 100, label: 'breaking point' }], shade, markers, vlines: phaseVlines(s, res), yUnit: '%', tipDigits: 0, tipTime: (x) => fmt(x, 2) + ' s (overall ' + fmt(res.def.globalStart + x, 2) + ' s)' }, 220, { group: pid }));
    const pick = el('details', { class: 'subsec' }, [el('summary', {}, ['Choose which parts to plot (' + sel.length + ' of ' + g.parts.length + ')'])]);
    const grid = el('div', { class: 'chk-grid' });
    g.parts.forEach((p, k) => { const cb = el('input', { type: 'checkbox' }); cb.checked = sel.includes(k); cb.addEventListener('change', () => { const cur = resultsUI.partSel[selKey]; if (cb.checked) cur.push(k); else cur.splice(cur.indexOf(k), 1); renderAll(); });
        grid.appendChild(el('label', { class: 'chk' }, [cb, p.label + ' — peak ' + fmt(peaks[k] * 100, 0) + '%' + (p.kind !== 'zone' ? ' (' + p.kind + ')' : '')])); });
    pick.appendChild(grid); wrap.appendChild(pick);
    const pctSeries = [{ label: 'Fatigue (worst part)', color: '#f59e0b', x: res.times, y: g.fatigue }, { label: 'Open surface (tears, gaps)', color: '#ef4444', x: res.times, y: g.exposed }];
    wrap.appendChild(makeChart({ title: 'Wear and opening (%)', series: pctSeries, xMin: 0, xMax: res.def.duration, yMin: 0, zeroBase: true, shade, vlines: phaseVlines(s, res), yUnit: '%', tipDigits: 0 }, 150, { group: pid }));
    const u = resultsUI.units, conv = (a) => { const y = new Float32Array(a.length); for (let j = 0; j < a.length; j++) y[j] = u === 'in' ? a[j] / 2.54 : a[j]; return y; };
    wrap.appendChild(makeChart({ title: 'Permanent stretch and total tear/split length (' + (u === 'in' ? 'in' : 'cm') + ')', series: [{ label: 'Permanent stretch (all parts)', color: '#c084fc', x: res.times, y: conv(g.perm) }, { label: 'Tears + seam splits', color: '#f87171', x: res.times, y: conv(g.tear) }], xMin: 0, xMax: res.def.duration, yMin: 0, zeroBase: true, shade, vlines: phaseVlines(s, res) }, 150, { group: pid }));
    return wrap;
}

function renderNarration(s, pid, res) {
    const wrap = el('div', {});
    const blocks = buildPhaseNarration(s, res, resultsUI.units);
    const gem = res._gemini && res._gemini.name === s.name && res._gemini.texts.length === blocks.length ? res._gemini : null;
    const tools = el('div', { class: 'run-row', style: 'margin-bottom:8px;' });
    tools.appendChild(el('span', { class: 'garm-type' }, [blocks.length + ' moments · click a moment’s heading to mark it on the charts' + (gem ? ' · ' + (gem.by || 'Gemini') + ' wording: ' + gem.texts.filter(x => x.text).length + ' used, ' + gem.texts.filter(x => !x.text).length + ' rejected' : '')]));
    tools.appendChild(el('span', { class: 'spacer' }));
    [['Gemini', geminiSettings, geminiRewrite], ['Claude', claudeSettings, claudeRewrite]].forEach(([by, cfg, fn]) => {
        if (!(cfg.enabled && cfg.apiKey)) return;
        tools.appendChild(el('button', { class: 'btn sm', onclick: async (ev) => {
            ev.target.disabled = true; ev.target.textContent = 'Asking ' + by + '…';
            try { const texts = await fn(s, pid, blocks); res._gemini = { name: s.name, texts, by }; showToast(by + ' wording: ' + texts.filter(x => x.text).length + ' of ' + texts.length + ' paragraphs passed the check'); }
            catch (err) { showToast(by + ' failed — keeping the local wording (' + String(err.message).slice(0, 140) + ')', 'err'); }
            renderAll(); } }, [gem && gem.by === by ? 'Reword again with ' + by : 'Reword with ' + by]));
    });
    if (gem) tools.appendChild(el('button', { class: 'btn sm', onclick: () => { delete res._gemini; renderAll(); } }, ['Back to local wording']));
    wrap.appendChild(tools);
    let lastStage = null;
    blocks.forEach((b, bi) => {
        if (b.stage && b.stage !== lastStage) { wrap.appendChild(el('div', { class: 'stage-hdr' }, [b.stage === 'A' ? 'Stage A — the Oozaru shape forms (0–14 s)' : 'Stage B — growth to full size (14–37 s)'])); lastStage = b.stage; }
        wrap.appendChild(renderNarrBlock(s, res, b, gem && gem.texts[bi]));
    });
    return wrap;
}

function renderNarrBlock(s, res, b, gemText) {
    const card = el('div', { class: 'narr' + (b.events.some(e => e.severity >= 3) ? ' narr-fail' : '') });
    const mkKey = s.id + res.phaseId;
    card.appendChild(el('button', { class: 'narr-hdr', title: 'Mark this moment on the charts', onclick: () => { resultsUI.marker[mkKey] = resultsUI.marker[mkKey] === b.t ? undefined : b.t; _liveCharts.forEach(ch => { if (ch.group === res.phaseId) { ch.cfg.vlines = phaseVlines(s, res); } }); redrawGroup(res.phaseId); } }, [
        el('span', { class: 'narr-label' }, [b.label]), el('span', { class: 'narr-t' }, [fmtT(res, b.t)]),
        el('span', { class: 'narr-layer' }, ['mind: ' + b.layer.consciousness + ' · voice: ' + b.layer.voice])]));
    if (b.section1.length) card.appendChild(el('div', { class: 'narr-s1' }, b.section1.map(l => el('div', {}, [l]))));
    const s2 = el('div', { class: 'narr-s2' });
    if (gemText && gemText.text) { s2.appendChild(document.createTextNode(gemText.text)); }
    else b.section2.forEach(x => { if (x.sfx) s2.appendChild(el('span', { class: 'sfx' }, [x.sfx])); else s2.appendChild(document.createTextNode(x.text)); });
    card.appendChild(s2);
    const byName = (res._gemini && res._gemini.by) || 'Gemini';
    if (gemText) card.appendChild(el('div', { class: 'narr-src' }, [gemText.text ? byName + ' wording, checked against this block’s numbers.' : byName + '’s paragraph was rejected (' + gemText.rejected + '); local wording shown.']));
    const nums = el('details', { class: 'subsec narr-nums' }, [el('summary', {}, ['Numbers behind this moment'])]);
    const t = el('table', { class: 'dtable' });
    t.appendChild(el('tr', {}, [el('th', {}, ['Measure']), el('th', {}, ['Phase start']), el('th', {}, ['Previous moment']), el('th', {}, ['Now'])]));
    const u = resultsUI.units;
    BODY_CHART_KEYS.forEach(([k, label]) => { const f = b.facts.body[k]; if (!f.now && !f.start) return; t.appendChild(el('tr', {}, [el('td', {}, [label]), el('td', { class: 'num' }, [fmtLen(f.start, u)]), el('td', { class: 'num' }, [fmtLen(f.prev, u)]), el('td', { class: 'num' }, [fmtLen(f.now, u)])])); });
    b.facts.garments.forEach(g => { if (!g.snap) return; t.appendChild(el('tr', {}, [el('td', {}, [cleanGarmentName(g.name)]), el('td', { class: 'num' }, ['']), el('td', { class: 'num' }, [g.prev && g.prev.held ? (g.prev.worst ? fmtPct(g.prev.worst.v) : '—') : 'off']),
        el('td', { class: 'num' }, [g.snap.held ? (g.snap.worst ? g.snap.worst.label + ' ' + fmtPct(g.snap.worst.v) : '—') : 'off'])])); });
    nums.appendChild(el('div', { class: 'tablewrap' }, [t]));
    card.appendChild(nums);
    return card;
}

/* =========================================================================
   SECTION: MASTER RENDER
   ========================================================================= */

function renderAll() {
    const keepY = window.scrollY;
    ensureAtLeastOneSubject();
    renderSubjectTabs();
    document.getElementById('subjectToolbar').innerHTML = '';
    renderSubjectToolbar();
    renderMainTabs();
    const main = document.getElementById('appMain');
    main.innerHTML = '';
    const subj = getActiveSubject(); if (!subj) return;
    if (state.activeMainTab === 'physique') { renderPhysiqueTab(main); refreshLive(); }
    else if (state.activeMainTab === 'garments') renderGarmentsTab(main);
    else if (state.activeMainTab === 'results') renderResultsTab(main);
    if (renderAll._lastTab === state.activeMainTab) window.scrollTo(0, keepY);
    renderAll._lastTab = state.activeMainTab;
}

/* =========================================================================
   SECTION: HEADER ACTIONS
   ========================================================================= */

document.getElementById('btnExport').addEventListener('click', exportJson);
document.getElementById('btnSaveCopy').addEventListener('click', saveCopyOfSimulator);
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('importFileInput').click());
document.getElementById('importFileInput').addEventListener('change', (ev) => {
    const file = ev.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        let result;
        try { result = migrateData(JSON.parse(e.target.result)); }
        catch (err) { showToast('Import failed: ' + err.message, 'err'); return; }
        if (!result.subjects.length) { showToast('Import failed: the file contains no subjects.', 'err'); return; }
        const finish = (replace) => {
            loadSubjectsIntoState(result, replace);
            scheduleSave(); renderAll();
            showToast('Imported ' + result.subjects.length + ' subject(s)' + (result.warnings.length ? ' \u2014 ' + result.warnings.join(' ') : ''), result.warnings.length ? 'warn' : null);
        };
        showModal('Import ' + result.subjects.length + ' subject(s)', 'Replace all current subjects with the imported ones, or add them alongside the ones you already have?', [
            { label: 'Cancel' },
            { label: 'Add alongside', fn: () => finish(false) },
            { label: 'Replace all', cls: 'pri', fn: () => finish(true) },
        ]);
    };
    reader.onerror = () => showToast('Import failed: the file could not be read.', 'err');
    reader.readAsText(file);
    ev.target.value = '';
});

/* =========================================================================
   SECTION: INIT
   ========================================================================= */

const loadMessage = loadInitialData();
ensureAtLeastOneSubject();
renderAll();
if (loadMessage) showToast(loadMessage, loadMessage.startsWith('Saved data could not') ? 'err' : null);
</script>
</body>
</html>
